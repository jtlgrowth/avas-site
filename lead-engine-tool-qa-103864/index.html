&lt;details&gt;&lt;summary&gt;Niche + keyword bank&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Search phrases people use when they need help. Swap in your niche.&lt;/p&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Social/content:&lt;/b&gt; &quot;looking for a social media manager&quot;, &quot;need help with my instagram&quot;, &quot;hiring a content creator&quot;, &quot;need a reels editor&quot;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Websites/funnels:&lt;/b&gt; &quot;looking for a web designer&quot;, &quot;need a website&quot;, &quot;recommend a webflow person&quot;, &quot;need a landing page&quot;&lt;/li&gt;&lt;li&gt;&lt;b&gt;VA/ops:&lt;/b&gt; &quot;looking for a virtual assistant&quot;, &quot;drowning in DMs&quot;, &quot;need admin help&quot;&lt;/li&gt;&lt;li&gt;&lt;b&gt;AI/automation:&lt;/b&gt; &quot;need to automate&quot;, &quot;want to add AI to my business&quot;, &quot;need a chatbot&quot;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Design:&lt;/b&gt; &quot;need a graphic designer&quot;, &quot;looking for a canva person&quot;, &quot;need brand design&quot;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Run the Find tab to expand this for your exact niche.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Scam + time-waster red flags&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Skip or be careful if you see:&lt;/p&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Fast money, crypto, forex, &quot;DM to earn&quot;, giveaways.&lt;/li&gt;&lt;li&gt;They are looking for work, not hiring (job seekers).&lt;/li&gt;&lt;li&gt;Another provider advertising the same service you offer.&lt;/li&gt;&lt;li&gt;Engagement bait (&quot;comment YES&quot;, &quot;tag 3 friends&quot;).&lt;/li&gt;&lt;li&gt;Vague &quot;building something big&quot; with no detail or budget.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Real buyers name a specific problem, a specific outcome, and a hint of seriousness.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How to price and package&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You already know the basics. Here&#x27;s the version that actually moves the number:&lt;/p&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Price the outcome, not your hours. Name what the result is worth before you name the fee.&lt;/li&gt;&lt;li&gt;Anchor high, never open with your lowest number.&lt;/li&gt;&lt;li&gt;Package into a retainer, recurring beats one-off every time.&lt;/li&gt;&lt;li&gt;Use the 3-tier proposal below, and make the middle tier the obvious yes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;AI tools cheat sheet&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Writing &amp; thinking:&lt;/b&gt; ChatGPT, Claude.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Building:&lt;/b&gt; Codex and AI coding tools, simple tools and scripts.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Automation:&lt;/b&gt; Make, Zapier, n8n.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Agents:&lt;/b&gt; Custom GPTs, give a task once, it repeats.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Design &amp; media:&lt;/b&gt; AI image, video and voice tools.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Organize:&lt;/b&gt; Notion plus AI for your tracker and SOPs.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Start with one from each row. You do not need all of them.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Client onboarding message (send once they say yes)&lt;/summary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Onboarding message&lt;/span&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;&lt;pre&gt;Yay, so excited to work with you, [FIRST NAME]!
To get us started, a few quick things:
1. What does a win look like for you in the next 90 days?
2. Any brand assets, logins or examples I should have?
3. Best way and time to reach you?
Here is how payment and next steps work: [YOUR PROCESS].
I will send a short plan by [DATE]. Let&#x27;s build.&lt;/pre&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Your 7-day quick-start plan&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Day 1:&lt;/b&gt; Fill in Setup. Pick one platform.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Day 2:&lt;/b&gt; Run Find, gather 15 posts, filter to your best 10.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Day 3-6:&lt;/b&gt; Reach out to 5 to 10 a day, log them, follow up after 2 days.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Day 7:&lt;/b&gt; Review My Leads. Double down on what got replies.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Do this one week and you&#x27;ll have run the full loop end to end, with real conversations started.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Close high-ticket clients (₱50k and up)&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;
&lt;p&gt;&lt;b&gt;The discovery call, 4 moves:&lt;/b&gt;&lt;/p&gt;
&lt;ol style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Ask about their goal and what is not working right now. Let them talk more than you do.&lt;/li&gt;&lt;li&gt;Reflect it back so they feel understood.&lt;/li&gt;&lt;li&gt;Show the gap between where they are and where they want to be.&lt;/li&gt;&lt;li&gt;Present your package as the bridge, priced to the outcome, not the hours.&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;&lt;b&gt;Anchor high:&lt;/b&gt; name the full value before the price. &quot;A client like this is usually worth ₱50k and up to you. The package to get you there is [X].&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;When they hesitate on price:&lt;/b&gt; &quot;Totally fair. Quick question, if this brought you even one new client, would it pay for itself?&quot; Then go quiet and let them answer.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Close:&lt;/b&gt; &quot;Want me to send the plan so we can start on [date]?&quot; Assume the yes, make it easy to say.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Your 3-tier proposal, ready to fill in (₱50k and up)&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;
&lt;p&gt;Copy this, rename the tiers, drop in your numbers. Most people say yes to the middle, so make it the obvious pick.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Open with the outcome, not the price:&lt;/b&gt; &quot;Here&#x27;s what getting [RESULT] is worth to you: [ANCHOR NUMBER]. Here are three ways we can get there.&quot;&lt;/p&gt;
&lt;ol style=&quot;padding-left:18px&quot;&gt;
&lt;li&gt;&lt;b&gt;Foundation, [₱X].&lt;/b&gt; The essential scope that solves the core problem. [1 to 2 key deliverables].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Growth, [₱XX], most popular.&lt;/b&gt; Everything in Foundation plus the pieces that actually move their number. This is your &quot;if you&#x27;re serious&quot; tier, and the one you point to.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Partner, [₱XXX].&lt;/b&gt; Higher touch, priority and speed, for the client who wants it handled. [premium extras].&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;b&gt;State the terms plainly:&lt;/b&gt; deposit to start (e.g. 50% upfront), retainer billed monthly, what&#x27;s included versus a new scope item, how add-ons get priced.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Scope-lock line to paste into the proposal:&lt;/b&gt; &quot;This covers [X]. Anything outside it is a new line item we price separately before we start, so we both always know what&#x27;s in scope.&quot;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Objection replies beyond price&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;
&lt;p&gt;&lt;b&gt;&quot;I already have someone for this.&quot;&lt;/b&gt; &quot;Love that, and I&#x27;m not here to replace what&#x27;s working. A lot of my clients kept their existing setup and brought me in for [the specific gap]. Want me to show you where I&#x27;d add, not overlap?&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;&quot;Let me run it by my partner / team.&quot;&lt;/b&gt; &quot;Totally, that&#x27;s the right call. To make that easy, want me to put the one-page version together so you&#x27;re not the one explaining it? I can include the exact ROI so the conversation is quick.&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;&quot;Can you guarantee results?&quot;&lt;/b&gt; &quot;I won&#x27;t insult you with a fake guarantee. What I can show you is exactly how I work, the checkpoints where we&#x27;ll know it&#x27;s landing, and what we adjust if it isn&#x27;t. That&#x27;s the honest version, and it&#x27;s why my clients stay.&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;&quot;Why you and not an agency?&quot;&lt;/b&gt; &quot;With an agency you get a team and a queue. With me you get the person who actually does the thinking, faster, and no account-manager telephone game. For [their situation], that speed is the point.&quot;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Mine the clients you already have (reactivation + referrals)&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;
&lt;p&gt;You already have a book of business. That&#x27;s higher-leverage than any cold DM. Use it.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Reactivate a past client:&lt;/b&gt; &quot;Hi [FIRST NAME], you crossed my mind today. I&#x27;ve since built [what&#x27;s new], and it made me think of [their goal from before]. No pitch, just, if it&#x27;s still on your list, I&#x27;d love to catch up. Open to it?&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Ask a happy client for a warm intro (specific, not &quot;know anyone?&quot;):&lt;/b&gt; &quot;Quick favour, [FIRST NAME]. I&#x27;m opening [N] spots this quarter for [exact type of person]. Who&#x27;s one person in your circle who fits that and would thank you for the intro? Happy to make you look good with a message you can just forward.&quot;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Turn a testimonial into a referral:&lt;/b&gt; after they praise you, reply: &quot;That means a lot. If you know one other [type] who needs this, I&#x27;d love an intro, and I&#x27;ll take great care of them like I did with you.&quot;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Pre-call diagnostic (send before the discovery call)&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;
&lt;p&gt;Send this before they book, or right after. It pre-qualifies budget, pre-frames you as the expert, and turns the call into an audit instead of a pitch.&lt;/p&gt;
&lt;p&gt;&quot;Before we hop on, three quick things so I can make our time useful:&lt;/p&gt;
&lt;ol style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;What&#x27;s the goal in the next 90 days?&lt;/li&gt;&lt;li&gt;What have you already tried, and where did it stall?&lt;/li&gt;&lt;li&gt;Roughly what are you investing in this area right now?&quot;&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;If they won&#x27;t answer #3, they&#x27;re likely not ready, and you just saved a call. If they do, you walk in knowing the budget and the pain.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Scale it (when the pipeline is full)&lt;/summary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Raise your prices once you are turning people away.&lt;/li&gt;&lt;li&gt;Build the automated engine (see the Build the engine tab) so leads come in without you searching.&lt;/li&gt;&lt;li&gt;Hand outreach to a VA using these exact templates and rules.&lt;/li&gt;&lt;li&gt;Turn your best-fit niche into a signature offer so every lead is pre-qualified.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;
&lt;summary&gt;Raise your rates (the script)&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You don&#x27;t need to apologize for this. You&#x27;ve gotten better, your time is worth more, and the client you&#x27;re afraid to tell this to already knows it. Give them notice, not a negotiation.&lt;/p&gt;
&lt;pre&gt;Hi [Name], I wanted to give you a heads up before it shows up on an invoice.

Starting [date, give at least 30 days notice], my rate for [service] is moving from [old rate] to [new rate]. This reflects [the added scope / the results we&#x27;ve been getting / simply that my rates are adjusting across the board, pick what&#x27;s true].

Nothing else about how we work together is changing, I just wanted you to hear it directly from me first instead of finding it on a new invoice. Happy to hop on a quick call if you want to talk through it.&lt;/pre&gt;
&lt;p&gt;Send it as its own message, not buried in a status update. And don&#x27;t discount yourself in the same message you&#x27;re raising your rate, it undoes the whole point.&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details&gt;
&lt;summary&gt;Ask for a testimonial (that you can actually use)&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Most testimonials are useless because the ask was too vague. &quot;Can you leave me a review?&quot; gets you &quot;great to work with!&quot; Ask for specifics instead.&lt;/p&gt;
&lt;pre&gt;Hi [Name], I loved working on [specific project/result] with you. Would you be open to sharing a quick testimonial? To make it easy, here are a few things that would help other founders picture what working together looks like:

1. What was going on before we started working together?
2. What specifically changed after (a number, a feeling, a habit that stopped)?
3. Would you tell another founder to work with me, and why?

Even a few sentences on those three helps a ton. No pressure on length, I just want it to sound like you, not like a generic review.&lt;/pre&gt;
&lt;p&gt;Ask right after a win lands, not months later when the memory&#x27;s gone soft. And always ask if you can use their name and business, don&#x27;t assume.&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details&gt;
&lt;summary&gt;Handle scope creep without being the bad guy&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Scope creep almost never feels like a big ask in the moment, it&#x27;s a &quot;quick favor&quot; here and a &quot;can you also just&quot; there. The fix isn&#x27;t saying no, it&#x27;s naming it kindly and putting it back on the agreement.&lt;/p&gt;
&lt;pre&gt;Hey [Name], happy to help with that! Quick note, this falls outside what we scoped for [package name], so I want to flag it before I dive in rather than after.

I can either:
1. Add it as a one-off for [price], or
2. We can build it into next month&#x27;s scope if this is something you&#x27;ll need regularly.

Either works for me, just let me know which makes more sense and I&#x27;ll get started.&lt;/pre&gt;
&lt;p&gt;You&#x27;re not punishing them for asking, you&#x27;re protecting the relationship from resentment down the line. Say yes to the work, not to doing it for free.&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details&gt;
&lt;summary&gt;Spot a bad-fit client before you sign&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;The clients that burn you out the fastest are rarely the ones who seem difficult upfront, they&#x27;re the ones who seem fine until three weeks in. Watch for these before you sign anything.&lt;/p&gt;
&lt;pre&gt;RED FLAGS:
- They negotiate the price before they&#x27;ve even asked what&#x27;s included.
- They mention a &quot;bad experience&quot; with every past provider, and it&#x27;s always the provider&#x27;s fault.
- They want to start &quot;right away&quot; but can&#x27;t answer basic questions about their business or goals.
- They ask you to work off-platform, off-contract, or &quot;just get started, we&#x27;ll figure out payment.&quot;
- Every message has an urgency to it that has nothing to do with the actual work.&lt;/pre&gt;
&lt;p&gt;&lt;b&gt;The graceful decline:&lt;/b&gt;&lt;/p&gt;
&lt;pre&gt;Hi [Name], thank you for taking the time to talk through this with me. After thinking it over, I don&#x27;t think I&#x27;m the right fit for what you&#x27;re looking for right now, but I wish you the best finding someone who is. Feel free to reach back out if things change down the line.&lt;/pre&gt;
&lt;p&gt;You don&#x27;t owe anyone a detailed reason. &quot;Not the right fit&quot; is a complete sentence.&lt;/p&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details&gt;
&lt;summary&gt;Your weekly numbers (health check)&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You don&#x27;t need a dashboard full of metrics, you need to know if something&#x27;s off before it becomes a problem. Check these once a week, same day, same time.&lt;/p&gt;
&lt;pre&gt;1. LEADS IN
How many real conversations started this week? If it&#x27;s dropped for two weeks straight, that&#x27;s your outreach or content telling you something, not a coincidence.

2. RESPONSE RATE
Of the people you reached out to, how many replied? A rate that&#x27;s quietly dropping usually means your opener needs a refresh, not that the whole strategy is broken.

3. FOLLOW-UPS SENT
Leads don&#x27;t go cold because people say no, they go cold because nobody follows up. If this number is at zero most weeks, that&#x27;s the leak.

4. CLIENT CHECK-INS
Any client gone quiet who&#x27;s usually chatty? That&#x27;s worth a message before it turns into a churn conversation.

These are directional, not guarantees, some weeks are just slow for reasons that have nothing to do with you. The point is noticing the pattern, not panicking over one bad week.&lt;/pre&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;details&gt;
&lt;summary&gt;The first 5 clients mindset&lt;/summary&gt;
&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Your first five clients are not going to be your best-paying, most polished, easiest clients. They&#x27;re the ones who take a chance on you while you&#x27;re still figuring out your own process, and that&#x27;s exactly what makes them valuable.&lt;/p&gt;
&lt;pre&gt;You are not behind because client #1 was messy. You&#x27;re not failing because you&#x27;re still writing your rules as you go. Every system in this blueprint, I built it after I needed it, not before.

Your first five clients aren&#x27;t there to make you look good. They&#x27;re there to teach you what you actually don&#x27;t know yet: what questions you forgot to ask upfront, what boundary you needed and didn&#x27;t have, what part of your process was still in your head and not written down anywhere.

Treat them well, learn everything you can from them, and don&#x27;t confuse a hard first client with a sign you picked the wrong path. You picked the path. You&#x27;re just early on it.&lt;/pre&gt;&lt;/div&gt;
&lt;/details&gt;

&lt;/section&gt;

&lt;section class=&quot;panel&quot; id=&quot;p-close&quot;&gt;
 &lt;h2 class=&quot;ph&quot;&gt;One last thing, from me to you&lt;/h2&gt;
 &lt;div class=&quot;sub&quot;&gt;You made it all the way to the end, and that already tells me something about you. You have the whole thing now: my prompts, my filters, my templates, this tool, the engine, the army. It&#x27;s all yours. So let&#x27;s make your very first move nice and small, okay?&lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;What you&#x27;re holding, in one breath&lt;/h3&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;The exact system I use to find clients: a step-by-step build guide, engineered prompts that do the thinking, a filter that keeps only real buyers, an outreach bank in a human voice, a tool that tracks it all, and the blueprint for the AI team and automation behind it. Not theory. The real one.&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;Your first 48 hours (do exactly this)&lt;/h3&gt;
  &lt;ol class=&quot;steps&quot;&gt;
   &lt;li&gt;Fill in Setup once. Five minutes, that&#x27;s it.&lt;/li&gt;
   &lt;li&gt;Run the Build Guide, Steps 1 and 2. Get your positioning sentence and your buyer phrases.&lt;/li&gt;
   &lt;li&gt;Open Find, gather 10 posts. Score them with the Step 4 prompt. Keep the greens.&lt;/li&gt;
   &lt;li&gt;Write 5 messages with the Step 5 prompt, in your voice. Send them.&lt;/li&gt;
   &lt;li&gt;Log them in My Leads and set a reminder to follow up in 2 days.&lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;note&quot;&gt;Five outreach messages sent in two days. Do that before you touch automation or the AI army. Prove it by hand first, then scale the fun stuff.&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;If it feels like a lot, come here for a second&lt;/h3&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;Breathe. You do not have to build the automated engine or the AI army to win, those are here for whenever you want them, no rush at all. The manual loop, find, filter, write, follow up, is the whole system, and it works beautifully on its own. Start there. I&#x27;ll be right here for the rest when you&#x27;re ready.&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;A last thing, from me&lt;/h3&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;I built this because I got tired of watching people who are genuinely brilliant at what they do stay invisible, just because &quot;getting clients&quot; felt like some secret only other people had been let in on. It&#x27;s not a secret. It&#x27;s a system. And now it&#x27;s yours.&lt;/p&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;So run it. Mess it up gloriously. Adjust. Run it again. That is exactly how I got here, and it&#x27;s how you&#x27;ll get there too. I am so proud of you for betting on yourself, truly. You&#x27;ve got this, and I&#x27;m cheering you on the whole way. Now go find your people.&lt;/p&gt;
  &lt;p style=&quot;text-align:right;color:var(--pink);font-weight:700;margin:8px 0 0&quot;&gt;Love, Gwen&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot; style=&quot;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;Tell me how it goes (I actually want to know)&lt;/h3&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;This is the part I love most. When something works for you, a first reply, a booked call, your first signed client, I genuinely want to hear about it. And if you have a minute, send me your thoughts and any feedback so I can keep making this better for you.&lt;/p&gt;
  &lt;p style=&quot;font-size:13.5px&quot;&gt;Email me anytime at &lt;a href=&quot;mailto:info@ayalavirtualassistance.site&quot; style=&quot;color:var(--pink);font-weight:700&quot;&gt;info@ayalavirtualassistance.site&lt;/a&gt;.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;And if this helped you land a client, I would be so grateful for a short testimonial I can share, just tell me what changed for you. Your win might be the exact thing that convinces the next person to finally bet on themselves too.&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;Want me in the room while you build it?&lt;/b&gt;&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;The 2-day workshop is where we set up your whole engine and your AI army together, live and tuned to your exact business. This tool is the map. The workshop is us walking it together.&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;promo&quot;&gt;
 &lt;div class=&quot;k2&quot;&gt;&amp;#127903;&amp;#65039; Your buyer bonus&lt;/div&gt;
 &lt;h4&gt;50% OFF the 2-day live AI Workshop&lt;/h4&gt;
 &lt;p&gt;Because you got the Blueprint, you get half off my in-person workshop, where we build your full automated engine and your own AI employees together, live.&lt;/p&gt;

 &lt;p&gt;Use it when you grab your seat. Join the waitlist first to get the dates and founding price before anyone else.&lt;/p&gt;
&lt;/div&gt;

splay:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}\n.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer}\n.tab.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(245,70,138,.3)}\n.wrap{max-width:780px;margin:0 auto;padding:22px}\n.panel{display:none}.panel.on{display:block}\nh2.ph{font-size:22px;color:var(--pink);font-weight:800;margin-bottom:7px;line-height:1.2;letter-spacing:-.2px}\n.sub{color:var(--muted);font-size:14.5px;line-height:1.62;margin-bottom:22px;max-width:64ch}\nlabel{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}\ninput,textarea,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;outline:none}\ninput:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(245,70,138,.15)}\ntextarea{min-height:80px;resize:vertical}\n.btn{border:0;background:var(--grad);color:#fff;font-weight:800;font-size:14.5px;padding:13px 22px;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(225,29,72,.28)}\n.btn.sm{padding:9px 16px;font-size:13px}\n.btn.ghost{background:transparent;color:var(--pink);border:2px solid var(--pink);box-shadow:none}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.saved{color:var(--sage);font-weight:800;font-size:13px;display:none}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--glow);margin:18px 0}\n.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:20px 0}\n.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 18px 17px 21px;box-shadow:var(--glow);position:relative}\n.vcard::before{content:&quot;&quot;;position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--grad)}\n.vcard b{display:block;font-size:14.5px;margin-bottom:4px;color:var(--ink)}\n.vcard span{color:var(--muted);font-size:12.5px;line-height:1.45}\n.note{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 17px;font-size:13.5px;line-height:1.6;color:var(--ink);margin:14px 0}\n.note b{color:var(--pink)}\n.promo{background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 12%,var(--surface)),var(--surface));border:2px dashed var(--pink);border-radius:16px;padding:22px;text-align:center;margin:18px 0}\n.promo .k2{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}\n.promo h4{font-size:19px;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}\n.promo p{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:46ch;margin:0 auto}\n.code{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 10px 12px 18px;margin:14px 0 6px}\n.code b{font-size:20px;font-weight:800;letter-spacing:.12em}\n.code button{border:0;background:var(--grad);color:#fff;font-weight:800;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer}\n.code button.ok{background:var(--sage)}\n.blk{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:12px 0;box-shadow:var(--glow)}\n.blkh{display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--pink) 8%,transparent);padding:10px 14px;font-weight:800;font-size:13px;color:var(--pink)}\n.cp{border:0;background:var(--grad);color:#fff;font-weight:800;font-size:11.5px;padding:6px 13px;border-radius:7px;cursor:pointer}\n.cp.ok{background:var(--sage)}\n.blk pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.5;padding:14px;margin:0}\n.steps{counter-reset:s;padding:0;list-style:none;margin:0 0 14px}\n.steps li{counter-increment:s;position:relative;padding:7px 0 7px 32px;font-size:14px;line-height:1.55}\n.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}\n.lead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:var(--glow)}\n.lead.done{opacity:.7}\n.lead .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.lead .nm{font-weight:800;font-size:15px}\n.lead .pf{font-size:11px;font-weight:700;color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,transparent);padding:3px 9px;border-radius:6px}\n.lead .post{color:var(--muted);font-size:12.5px;margin:6px 0;font-style:italic}\n.lead .msg{background:var(--soft);border-radius:9px;padding:9px 11px;font-size:12.5px;white-space:pre-wrap;margin:6px 0;max-height:120px;overflow:auto}\n.lead .lf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}\n.lead select{width:auto;padding:7px 10px;font-size:12.5px;font-weight:700}\n.xbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}\n.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer}\n.chip.on{background:var(--grad);border-color:transparent;color:#fff}\ndetails{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:10px}\ndetails summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}\ndetails summary::-webkit-details-marker{display:none}\n.empty{color:var(--muted);text-align:center;padding:30px;font-weight:600}\n.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--grad);color:#fff;padding:11px 22px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;transition:.3s;z-index:80}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n&lt;\u002Fstyle&gt;\n&lt;header class=&quot;top&quot;&gt;&lt;div class=&quot;k&quot;&gt;Ayala Virtual Assistance Services&lt;\u002Fdiv&gt;&lt;h1&gt;The Lead Engine Blueprint&lt;\u002Fh1&gt;&lt;p&gt;This is literally my lead engine. The exact prompts, filters and tool I run every morning, now yours.&lt;\u002Fp&gt;&lt;\u002Fheader&gt;\n&lt;nav class=&quot;tabs&quot;&gt;\n &lt;button class=&quot;tab on&quot; data-t=&quot;start&quot;&gt;Start here&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;guide&quot;&gt;The Build Guide&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;army&quot;&gt;Your AI army&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;auto&quot;&gt;Build the engine&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;book&quot;&gt;Handbook&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;setup&quot;&gt;Setup&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;find&quot;&gt;Find&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;lead&quot;&gt;New Lead&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;track&quot;&gt;My Leads&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;content&quot;&gt;Content&lt;\u002Fbutton&gt;\n &lt;button class=&quot;tab&quot; data-t=&quot;close&quot;&gt;Closing&lt;\u002Fbutton&gt;\n&lt;\u002Fnav&gt;\n&lt;div class=&quot;wrap&quot;&gt;\n\n&lt;section class=&quot;panel on&quot; id=&quot;p-start&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;You&#x27;re in. This is the whole machine.&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Not a prompt pack, not a course you&#x27;ll never finish. This is my actual lead engine, documented, with the real prompts I type, the filter rules I trust, and the tool I run every day. Here&#x27;s everything that&#x27;s now yours:&lt;\u002Fdiv&gt;\n &lt;div class=&quot;vgrid&quot;&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Build Guide&lt;\u002Fb&gt;&lt;span&gt;How I built my engine, step by step, in the exact order I did it. Open the Build Guide tab.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;My real prompts&lt;\u002Fb&gt;&lt;span&gt;The exact prompts I type into ChatGPT or Claude. The originals, not watered down.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;My filter rules&lt;\u002Fb&gt;&lt;span&gt;The green-light and red-flag signals I use to kill a fake lead before it wastes my time.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Outreach Bank&lt;\u002Fb&gt;&lt;span&gt;My real comments, DMs, emails, proposals, follow-ups and objection replies.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Platform Map&lt;\u002Fb&gt;&lt;span&gt;Where and exactly how I find clients on FB, Threads, IG, LinkedIn, Upwork and OnlineJobs.ph.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Lead Tool&lt;\u002Fb&gt;&lt;span&gt;The working dashboard I run daily. Find, qualify, draft, track and follow up, with one-tap CSV export.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Content Engine&lt;\u002Fb&gt;&lt;span&gt;Generate posts and hooks that pull the right clients to you.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Build the engine&lt;\u002Fb&gt;&lt;span&gt;How my automated version actually works, and how to build it with your paid AI.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Build your AI army&lt;\u002Fb&gt;&lt;span&gt;How I build my own AI employees, step by step, with a starter template.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Bonuses&lt;\u002Fb&gt;&lt;span&gt;Pricing guide, onboarding scripts, keyword bank, 7-day plan and how I close ₱50k and up.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot; style=&quot;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 6px;font-size:15px&quot;&gt;New here? Do exactly this, in order&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px;margin:0 0 8px&quot;&gt;Don&#x27;t overthink it. You only need three things to get your first leads today:&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;Read The Build Guide first.&lt;\u002Fb&gt; It shows you how I built this whole thing, step by step. Start there so the rest makes sense. &lt;i&gt;(Tab: The Build Guide)&lt;\u002Fi&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Set up your details once.&lt;\u002Fb&gt; Tell the tool your service, who you help, and your voice. &lt;i&gt;(Tab: Setup)&lt;\u002Fi&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Find and reach out.&lt;\u002Fb&gt; Pull real buyers, let your AI write the message, send and save. &lt;i&gt;(Tabs: Find &amp;rarr; New Lead &amp;rarr; My Leads)&lt;\u002Fi&gt;&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;p style=&quot;font-size:13.5px;margin:10px 0 0&quot;&gt;&lt;b&gt;That&#x27;s it.&lt;\u002Fb&gt; Everything else in here makes that loop stronger. You do not need to read it all before you start.&lt;\u002Fp&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 12px;font-size:15px&quot;&gt;How the daily loop works, in 4 simple steps&lt;\u002Fh3&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;Tell the tool about you&lt;\u002Fb&gt;, once. Your service, who you help, and your voice.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Find people&lt;\u002Fb&gt; already asking for what you sell. The tool writes the search prompt, you paste it into your free ChatGPT or Claude.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Reach out in your voice.&lt;\u002Fb&gt; Paste anyone&#x27;s post, the tool builds the message prompt, your AI writes it, you send and save it.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Track everyone&lt;\u002Fb&gt; in My Leads and follow up. That is the whole engine.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 10px;font-size:15px&quot;&gt;What each tab is for (your map)&lt;\u002Fh3&gt;\n  &lt;div class=&quot;vgrid&quot; style=&quot;margin:0&quot;&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;The Build Guide&lt;\u002Fb&gt;&lt;span&gt;How I built it, step by step, with my prompts. Read first.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Setup&lt;\u002Fb&gt;&lt;span&gt;Enter your details once so everything is personalized.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Find&lt;\u002Fb&gt;&lt;span&gt;Get your exact search plan to pull fresh buyers.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;New Lead&lt;\u002Fb&gt;&lt;span&gt;Paste a post, get a qualified score + a message in your voice.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;My Leads&lt;\u002Fb&gt;&lt;span&gt;Track everyone, follow up, and back up your list.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Content&lt;\u002Fb&gt;&lt;span&gt;Make posts and hooks that pull clients to you.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Build the engine&lt;\u002Fb&gt;&lt;span&gt;Automate it, including with your paid AI, when you&#x27;re ready.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Your AI army&lt;\u002Fb&gt;&lt;span&gt;Build your own AI employees, like the team that helped me build this.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n   &lt;div class=&quot;vcard&quot;&gt;&lt;b&gt;Handbook&lt;\u002Fb&gt;&lt;span&gt;Every template, rule, script and the full reference.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n  &lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Two ways to run this:&lt;\u002Fb&gt; start &lt;b&gt;manual&lt;\u002Fb&gt; today with a free ChatGPT or Claude and about 30 minutes a day, then &lt;b&gt;automate&lt;\u002Fb&gt; it later (the Build the engine tab shows you how, even with your own paid AI). Same engine, you just choose the speed.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;One golden rule:&lt;\u002Fb&gt; go slow, 5 to 10 people a day, and tweak a word or two each time so every message feels personal, never copy-pasted.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;promo&quot;&gt;\n &lt;div class=&quot;k2&quot;&gt;&amp;#127903;&amp;#65039; Your buyer bonus&lt;\u002Fdiv&gt;\n &lt;h4&gt;50% OFF the 2-day live AI Workshop&lt;\u002Fh4&gt;\n &lt;p&gt;Because you got the Blueprint, you get half off my in-person workshop, where we build your full automated engine and your own AI employees together, live.&lt;\u002Fp&gt;\n &lt;div class=&quot;code&quot;&gt;&lt;b&gt;AIWORKSHOP50&lt;\u002Fb&gt;&lt;button onclick=&quot;if(navigator.clipboard){navigator.clipboard.writeText(&#x27;AIWORKSHOP50&#x27;)}this.textContent=&#x27;Copied \\u2713&#x27;;this.classList.add(&#x27;ok&#x27;)&quot;&gt;Copy code&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;p&gt;Use it when you grab your seat. Join the waitlist first to get the dates and founding price before anyone else.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;\n &lt;div class=&quot;row&quot; style=&quot;margin-top:18px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;gostart&quot;&gt;Let&#x27;s set you up &amp;rarr;&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-guide&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;How I built my lead engine, step by step&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;This is exactly how I did it, in order. Follow each step, use my real prompts, and you will have your own engine. Do it by hand today, automate it later. Everything with a Copy button is ready to paste into your AI.&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Niche Fit Test (do this before Step 1)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Before you build anything, check if your niche is actually searchable. Answer these three honestly.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;Can you name 20 real people right now who&#x27;d buy this within the month? Not &quot;people like this exist somewhere.&quot; Actual names.&lt;\u002Fli&gt;\n    &lt;li&gt;Is there a visible online place they gather? A group, a hashtag, a subreddit, a page. Somewhere you could point to and say &quot;they&#x27;re there.&quot;&lt;\u002Fli&gt;\n    &lt;li&gt;Can you describe their pain in their own words, the way they&#x27;d type it, not the way you&#x27;d pitch it?&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;If you answered mostly no, don&#x27;t build the engine yet. Tighten the niche first. A broad niche gives you a broad engine that finds nobody in particular.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Tighten my niche&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;I&#x27;m building a lead engine for [rough niche\u002Foffer]. Help me narrow this into a specific, searchable niche. Ask me who exactly buys this, where they gather online, and what pain they&#x27;d type in their own words. Then give me 3 tighter niche options I could actually find 20 real people for this month.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 1 &amp;middot; Translate your offer into what the machine hunts for&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; most people write their offer for humans to admire, not for AI to search. &quot;I help entrepreneurs grow their business&quot; gives the machine nothing to hunt for, it is too wide, too soft, too safe. I rewrote mine into one sentence with a person, a result, and a method in it, then made the AI hand me the exact people and exact places to go find them. The pitfall nobody tells you: if your positioning sentence could describe five other businesses, the AI will surface leads for all five, and you will drown in the wrong ones.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a senior positioning strategist who has repositioned 100+ service businesses.\n\nMy service: [YOUR SERVICE]\nMy current one-liner (if any): [PASTE OR WRITE &quot;none&quot;]\n\nDo this in order:\n1. Write ONE positioning sentence in this exact structure: &quot;I help [WHO, specific not broad] get [RESULT, measurable or felt] through [HOW, your method in 3-6 words].&quot;\n2. Pressure-test it: could this sentence also describe 3 other common businesses? If yes, tighten WHO or RESULT until it can&#x27;t.\n3. List the 3 buyer segments who need this most right now, ranked by how urgently they need it.\n4. For each segment, name the 2 platforms\u002Fcommunities where they actually post about this problem (not where they &quot;hang out generally&quot; but where they complain, ask, or vent about it).\n\nOUTPUT FORMAT (use these exact headers):\nPOSITIONING SENTENCE:\nWHY IT&#x27;S SPECIFIC ENOUGH:\nSEGMENT 1  - [name] | urgency: high\u002Fmed\u002Flow | platforms:\nSEGMENT 2  - [name] | urgency: high\u002Fmed\u002Flow | platforms:\nSEGMENT 3  - [name] | urgency: high\u002Fmed\u002Flow | platforms:\n\nWorked example  - service: &quot;social media management for coaches&quot;\nPOSITIONING SENTENCE: I help wellness coaches get consistent, booked-out clients through done-for-you content and DM follow-up.\nSEGMENT 1  - solo wellness coaches under 10k followers | urgency: high | platforms: Facebook coaching groups, Threads&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; &quot;I help wellness coaches get consistent clients through done-for-you social media&quot; &amp;rarr; tightened to &quot;I help wellness coaches get booked-out clients through done-for-you content and DM follow-up&quot; (the original was too vague to search well).&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 2 &amp;middot; Find the exact words they post&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; real buyers don&#x27;t post &quot;I need a marketing agency.&quot; They post messy, specific, half-embarrassed things like &quot;does anyone actually know what they&#x27;re doing with Instagram, I&#x27;m losing my mind.&quot; I stopped searching for my service name and started searching for the sentence someone types at 11pm when they&#x27;re frustrated. Pitfall: generic phrase lists give you generic (usually saturated) leads. The good ones are oddly specific.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a social listening expert who studies how frustrated buyers actually phrase problems before they know a solution exists.\n\nMy service: [YOUR SERVICE]\nPlatform I&#x27;m searching: [PLATFORM]\nMy buyer segment: [SEGMENT FROM STEP 1]\n\nGive me 25 phrases this person would realistically type or post, split into 3 buckets:\n- 10 &quot;venting&quot; phrases (frustrated, no solution language yet)\n- 10 &quot;actively looking&quot; phrases (asking for recommendations, comparing options)\n- 5 &quot;almost ready&quot; phrases (mentions budget, timeline, or &quot;finally doing this&quot;)\n\nFor 5 of the 25, write a one-line example of what a REAL buyer post looks like vs. what a TIME-WASTER post looks like (someone just chatting, a competitor, a troll) using the same phrase, so I can tell them apart at a glance.\n\nOUTPUT FORMAT:\nVENTING (10):\nACTIVELY LOOKING (10):\nALMOST READY (5):\nBUYER vs TIME-WASTER EXAMPLES (5 pairs):\n  Phrase: ...\n  Real buyer post: &quot;...&quot;\n  Time-waster post: &quot;...&quot;&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; phrase &quot;no idea what I&#x27;m doing with content anymore&quot; &amp;rarr; real buyer: &quot;no idea what I&#x27;m doing with content anymore, been posting for 6 months and nothing&#x27;s converting&quot; vs. time-waster: &quot;no idea what I&#x27;m doing with content anymore lol&quot; (no context, no pain, could be anyone).&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 3 &amp;middot; Gather the posts&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; this is where most people give up because they&#x27;re manually scrolling and copy-pasting. Don&#x27;t. Take your 25 phrases from Step 2 straight into the &lt;b&gt;Find&lt;\u002Fb&gt; tab and let it pull the actual posts for you. Pitfall: don&#x27;t search all 25 phrases at once, run your &quot;almost ready&quot; bucket first, those posts convert fastest and prove the engine works before you invest time in the slower buckets.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a search strategist. I have these 25 phrases from my listening research: [PASTE PHRASES]\n\nTurn them into 8 short search queries (3-6 words each) optimized for finding posts on [PLATFORM], grouped by urgency (almost ready first). Avoid generic single words that return noise.\n\nOUTPUT FORMAT:\nPRIORITY 1 (run first):\nPRIORITY 2:\nPRIORITY 3:&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; go to the Find tab now and drop your Priority 1 queries in first.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 4 &amp;middot; Keep only the real buyers&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; this is the step that saves you the most time and the most dignity. I don&#x27;t reach out to everyone who mentions my topic, I filter first. Pitfall almost nobody catches: a post can look like a buyer signal and still be a trap, someone selling the same service as you, a job post looking for an employee not a provider, or a post over 3 days old where the moment already passed. I built one rule to catch all three before I waste a DM.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a lead qualification analyst. Score the pasted post from 1-10 on how likely this is a real buyer for [YOUR SERVICE], using this rubric:\n\nGREEN signals (raise score): expresses a specific problem or pain, asks for recommendations\u002Fhelp, mentions timeline or budget, sounds like the business owner (not staff), posted within 3 days.\nRED signals (drop score, override to LOW even if other signals are green): is themselves a provider of this service, is a job\u002Fhiring post looking for an employee, reads like clout-bait or engagement farming, sounds like a scam\u002Fbot pattern, is older than 3 days.\n\nPOST TO SCORE: [PASTE POST]\n\nOUTPUT FORMAT (exact):\nSCORE: X\u002F10\nVERDICT: GREEN or RED\nWHY (one line, plain language):\nRED FLAGS FOUND: [list or &quot;none&quot;]\nREACH OUT: YES or NO\n\nWorked example:\nPOST: &quot;anyone know a good agency for social media? my current VA just isn&#x27;t cutting it, tired of doing this myself&quot;\nSCORE: 8\u002F10\nVERDICT: GREEN\nWHY: business owner, specific pain (VA underperforming), actively asking, recent\nRED FLAGS FOUND: none\nREACH OUT: YES&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; a post that mentions your exact keywords but was posted 9 days ago by someone whose bio says &quot;Social Media Manager&quot; &amp;rarr; scores low automatically, RED, no matter how good the wording looks.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 5 &amp;middot; Write outreach that sounds like you&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; this is where most AI outreach dies, it sounds like AI wrote it, because people paste two random sentences and call that &quot;their voice.&quot; Voice isn&#x27;t your words, it&#x27;s your patterns: sentence length, punctuation habits, how you greet people, whether you use emojis, how formal you get. I made the AI extract my actual patterns first, then write in them, instead of just mimicking vocabulary. Pitfall: never let the AI use the words &quot;circle back,&quot; &quot;reaching out,&quot; or &quot;hope this finds you well,&quot; those are the fastest tells that a DM was AI-generated.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a ghostwriter who specializes in matching a founder&#x27;s exact texting voice, not generic &quot;friendly DM&quot; voice.\n\nSTEP A  - Extract my voice from these 3-5 real messages I&#x27;ve actually sent: [PASTE 3-5 OF YOUR OWN MESSAGES\u002FCAPTIONS]\nIdentify: average sentence length, punctuation habits (periods vs none, use of &quot;...&quot;), greeting style, how I use emojis (if at all), formality level, any verbal tics or phrases I repeat.\n\nSTEP B  - Write the DM using that exact voice profile.\nTheir post: [PASTE POST]\nMe: [YOUR NAME], I help [WHO] with [WHAT I DO]\nRules: reference something specific from their post (not just &quot;saw your post&quot;), no pitch in the first message, one soft next step only, keep it under 40 words, never use &quot;circle back,&quot; &quot;reaching out,&quot; or &quot;hope this finds you well.&quot;\n\nOUTPUT FORMAT:\nVOICE PROFILE (3 bullet points):\nDM DRAFT:\nWHY THIS MATCHES MY VOICE (1 line):&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; voice profile flagged &quot;short sentences, no emojis, starts with the person&#x27;s situation not a greeting&quot; &amp;rarr; DM opened with &quot;saw you&#x27;re doing everything yourself with content rn&quot; instead of &quot;Hi! I hope you&#x27;re doing well!&quot;&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 6 &amp;middot; Track everyone and follow up&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; the money is in the follow-up, not the first DM, most people reply on message 2 or 3, not message 1. I stopped treating silence as rejection and started treating it as &quot;not yet.&quot; Everything lives in the &lt;b&gt;My Leads&lt;\u002Fb&gt; tab so nothing falls through. Pitfall: don&#x27;t send the same energy twice, a second &quot;hey just following up!&quot; reads as desperate, each follow-up needs a new reason to exist.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a follow-up strategist. This lead went quiet after my first message.\n\nFirst message I sent: [PASTE]\nDays since: [NUMBER]\nAnything new I know about them since (post, story, launch, etc.): [PASTE OR &quot;nothing new&quot;]\n\nWrite 3 follow-up options, each with a DIFFERENT angle so none of them sound like &quot;just checking in&quot;:\n1. VALUE-ADD: share a quick, genuinely useful thought related to their original post, no ask.\n2. LIGHT\u002FHUMAN: short, low-pressure, references something new if I have it, or gently acknowledges time passing.\n3. DIRECT: a clear, no-pressure yes\u002Fno question that makes it easy for them to respond either way.\n\nRules: under 25 words each, no guilt-tripping language, no &quot;just following up,&quot; match the voice profile from Step 5 if provided: [PASTE VOICE PROFILE OR SKIP]\n\nOUTPUT FORMAT:\nOPTION 1 (value-add):\nOPTION 2 (light\u002Fhuman):\nOPTION 3 (direct):\nRECOMMENDED PICK + WHY:&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; lead went quiet for 6 days &amp;rarr; direct option: &quot;no pressure either way, still figuring out your content or already sorted?&quot; got a reply in 20 minutes.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 7 &amp;middot; Make it run on autopilot&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; a system you have to remember to run isn&#x27;t a system, it&#x27;s a chore, and chores get skipped the first busy week. I built mine to run daily without me touching it, so leads are waiting in my inbox instead of me hunting for them. Head to the &lt;b&gt;Build the engine&lt;\u002Fb&gt; tab to set your cadence. Pitfall: don&#x27;t set it to run more often than you can actually follow up, a full inbox of unanswered leads is worse than a small one you actually work. And don&#x27;t automate a channel until you&#x27;ve closed a client or two on it by hand first, automate what already works, not what you&#x27;re still guessing at.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as an ops consultant reviewing my lead engine cadence. I can realistically spend [NUMBER] minutes a day on outreach and follow-up.\n\nGiven that time budget, tell me: how many new leads should I search for daily, how many follow-ups can I realistically send, and what&#x27;s the one task I should automate first vs. do manually.\n\nOUTPUT FORMAT:\nDAILY LEAD SEARCH VOLUME:\nDAILY FOLLOW-UP CAPACITY:\nAUTOMATE FIRST:\nDO MANUALLY (for now):&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; set the engine to find 10 leads\u002Fday, capped, so my &quot;My Leads&quot; tab never looks like an unread inbox I&#x27;m avoiding.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Step 8 &amp;middot; Turn replies into paying clients&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; getting a reply isn&#x27;t the win, getting on a call is. I use the &lt;b&gt;Handbook&lt;\u002Fb&gt; tab for the full playbook, but the single biggest shift for me was changing how I open the discovery call. Pitfall: don&#x27;t open with &quot;tell me about your business,&quot; that&#x27;s a lazy question that makes people repeat their Instagram bio. Open with something that proves you already read their post.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a sales coach who trains service providers to run discovery calls that feel like a conversation, not an interrogation.\n\nTheir original post\u002Fmessage: [PASTE]\nOur DM thread so far: [PASTE OR SUMMARIZE]\nMy service: [YOUR SERVICE]\n\nGive me:\n1. An opening line that references something specific from their post\u002Fthread (not &quot;tell me about your business&quot;).\n2. 3 discovery questions that uncover their real problem, not surface-level info I already know.\n3. One line I can use to transition from &quot;understanding their problem&quot; to &quot;here&#x27;s how I&#x27;d help,&quot; without it sounding like a pitch.\n\nOUTPUT FORMAT:\nOPENING LINE:\nDISCOVERY QUESTION 1:\nDISCOVERY QUESTION 2:\nDISCOVERY QUESTION 3:\nTRANSITION LINE:&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; opening line &quot;you mentioned you&#x27;re doing content yourself right now, how&#x27;s that actually going day to day?&quot; got more real answers than &quot;tell me about your business&quot; ever did.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Bonus &amp;middot; Sharpen your niche when leads feel scattered&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; if your leads feel random, &quot;some coaches, some agencies, a random real estate guy,&quot; it&#x27;s not the engine, it&#x27;s your positioning being too wide. I run this whenever my lead quality dips instead of blaming the tool.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a positioning strategist. Here are my last 10 leads and how good\u002Fbad each one was: [PASTE LIST WITH A GOOD\u002FBAD NOTE ON EACH]\n\nFind the pattern in my BEST leads only (ignore the bad ones). What do they have in common: industry, business size, stage, specific pain? Then rewrite my positioning sentence from Step 1 to target that pattern specifically, even if it narrows my audience.\n\nOUTPUT FORMAT:\nPATTERN IN BEST LEADS:\nNARROWED POSITIONING SENTENCE:\nWHAT I&#x27;M INTENTIONALLY GIVING UP (and why that&#x27;s fine):&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; pattern showed my best leads were all coaches under 5k followers who&#x27;d just hired and fired a VA &amp;rarr; narrowed from &quot;coaches&quot; to &quot;coaches who tried outsourcing once and got burned.&quot;&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Bonus &amp;middot; Personalize at scale without it feeling copy-pasted&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; personalizing every DM one by one doesn&#x27;t scale, but a template that&#x27;s obviously a template kills replies faster than sending nothing. I built a middle ground: one strong skeleton, a different specific hook every time.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a copywriter who personalizes outreach at volume without it reading like a mail merge.\n\nHere&#x27;s my DM skeleton (the parts that stay the same): [PASTE YOUR BASE MESSAGE]\nHere are 5 leads with a detail from each of their posts: [PASTE 5 LEADS + ONE DETAIL EACH]\n\nWrite 5 versions of the DM, keeping the skeleton&#x27;s structure and length, but swapping in a genuinely specific opening line for each lead pulled from their detail. No two openings should be structurally identical (vary sentence shape, not just the noun).\n\nOUTPUT FORMAT:\nLEAD 1 DM:\nLEAD 2 DM:\nLEAD 3 DM:\nLEAD 4 DM:\nLEAD 5 DM:&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; same skeleton, 5 different openers, none of them started with &quot;I saw your post about,&quot; because if all 5 open the same way, it&#x27;s not personalization, it&#x27;s find-and-replace.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Bonus &amp;middot; Handle the price question without shrinking&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;&lt;b&gt;What I did:&lt;\u002Fb&gt; &quot;how much do you charge&quot; too early in a DM thread is the moment most people panic and either underquote or overexplain. I built one script that holds the price with confidence and redirects to value, without dodging the question, because dodging kills trust.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;The prompt I used&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Act as a sales coach helping me answer a price question in a DM without sounding defensive, apologetic, or evasive.\n\nMy price\u002Frange: [YOUR PRICE]\nWhat&#x27;s included: [WHAT&#x27;S INCLUDED, 2-3 items]\nThe lead&#x27;s message asking about price: [PASTE]\n\nWrite a reply that: states the price\u002Frange directly (no dodging), briefly frames what it includes in terms of outcome not just deliverables, and ends with a low-pressure next step. Keep it under 45 words. Do not apologize for the price or over-justify it.\n\nOUTPUT FORMAT:\nREPLY:\nWHY THIS WORKS (1 line):&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Sample:&lt;\u002Fb&gt; &quot;it&#x27;s [PRICE] for [OUTCOME], includes [2 things]. happy to walk you through exactly what that looks like on a quick call if you want&quot; holds the price without sounding like an apology.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);font-size:15px;margin:0 0 8px&quot;&gt;Your weekly Lead Engine rhythm&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;This isn&#x27;t a one-time campaign, it&#x27;s a rhythm you repeat. Here&#x27;s how I&#x27;d spread the core steps across a week so it becomes a habit, not a project.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;&lt;strong&gt;Monday:&lt;\u002Fstrong&gt; Steps 1 to 2. Sharpen your positioning sentence and pull your buyer phrases for the week.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Tuesday:&lt;\u002Fstrong&gt; Steps 3 to 4. Gather the posts and score them, keep only the greens.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Wednesday:&lt;\u002Fstrong&gt; Step 5. Write and send outreach to your top leads, in your voice.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Thursday:&lt;\u002Fstrong&gt; Step 6. Log everyone and send your follow-ups. Most replies live here, not in the first message.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Daily, 10 minutes:&lt;\u002Fstrong&gt; a quick follow-up check every day, even a light one. Warm leads go cold fast when you disappear on them.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Friday:&lt;\u002Fstrong&gt; review the week and run any discovery calls (Step 8). What worked, which source actually converted, what to adjust before Monday.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot;&gt;Step 7, automating it, is a one-time setup, not part of the weekly loop. Run this loop for four weeks straight before you decide if it&#x27;s working. One good week or one bad week doesn&#x27;t tell you anything yet.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;That&#x27;s the whole engine.&lt;\u002Fb&gt;&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;Run these 8 steps and you have exactly what I built. Want me to set it up WITH you, live? Ask about the 2-day workshop.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-setup&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Set up your profile once&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;This fills in every prompt for you automatically. It stays saved on your device.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot;&gt;\n  &lt;label&gt;Your name&lt;\u002Flabel&gt;&lt;input id=&quot;f-name&quot; placeholder=&quot;e.g. Maria Santos&quot;&gt;\n  &lt;label&gt;What you do \u002F your service&lt;\u002Flabel&gt;&lt;input id=&quot;f-service&quot; placeholder=&quot;e.g. social media management for coaches&quot;&gt;\n  &lt;label&gt;Who your ideal client is&lt;\u002Flabel&gt;&lt;input id=&quot;f-icp&quot; placeholder=&quot;e.g. wellness coaches and small e-comm brands&quot;&gt;\n  &lt;label&gt;Your voice (paste 2 to 3 sentences you&#x27;ve actually written, so the AI sounds like you)&lt;\u002Flabel&gt;&lt;textarea id=&quot;f-voice&quot; placeholder=&quot;Paste a few real sentences in your natural tone...&quot;&gt;&lt;\u002Ftextarea&gt;\n  &lt;label&gt;Portfolio link&lt;\u002Flabel&gt;&lt;input id=&quot;f-portfolio&quot; placeholder=&quot;https:\u002F\u002F...&quot;&gt;\n  &lt;label&gt;Website link&lt;\u002Flabel&gt;&lt;input id=&quot;f-website&quot; placeholder=&quot;https:\u002F\u002F...&quot;&gt;\n  &lt;label&gt;Booking link&lt;\u002Flabel&gt;&lt;input id=&quot;f-book&quot; placeholder=&quot;https:\u002F\u002Fcalendly.com\u002F...&quot;&gt;\n  &lt;div class=&quot;row&quot; style=&quot;margin-top:16px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;save&quot;&gt;Save my profile&lt;\u002Fbutton&gt;&lt;span class=&quot;saved&quot; id=&quot;savedmsg&quot;&gt;Saved&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;New here? Do this in order: &lt;b&gt;Setup&lt;\u002Fb&gt;, then &lt;b&gt;Find&lt;\u002Fb&gt; to get search phrases, then &lt;b&gt;New Lead&lt;\u002Fb&gt; for each person you find, and track them in &lt;b&gt;My Leads&lt;\u002Fb&gt;.&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-find&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Find people who need you&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Get your exact search plan. Then go hunt.&lt;\u002Fdiv&gt;\n &lt;label&gt;Which platform are you searching?&lt;\u002Flabel&gt;\n &lt;select id=&quot;find-platform&quot;&gt;&lt;option&gt;Facebook and Groups&lt;\u002Foption&gt;&lt;option&gt;Threads&lt;\u002Foption&gt;&lt;option&gt;Instagram&lt;\u002Foption&gt;&lt;option&gt;LinkedIn&lt;\u002Foption&gt;&lt;option&gt;Upwork&lt;\u002Foption&gt;&lt;option&gt;OnlineJobs.ph&lt;\u002Foption&gt;&lt;option&gt;X (Twitter)&lt;\u002Foption&gt;&lt;option&gt;TikTok&lt;\u002Foption&gt;&lt;option&gt;Reddit&lt;\u002Foption&gt;&lt;option&gt;another platform&lt;\u002Foption&gt;&lt;\u002Fselect&gt;\n &lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;genfind&quot;&gt;Build my search prompt&lt;\u002Fbutton&gt;&lt;a class=&quot;btn ghost sm&quot; href=&quot;https:\u002F\u002Fchatgpt.com&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open ChatGPT&lt;\u002Fa&gt;&lt;a class=&quot;btn ghost sm&quot; href=&quot;https:\u002F\u002Fclaude.ai&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open Claude&lt;\u002Fa&gt;&lt;\u002Fdiv&gt;\n &lt;div id=&quot;find-out&quot;&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;How to use it:&lt;\u002Fb&gt; tap Copy, paste it into ChatGPT or Claude, and it gives you the exact phrases to search plus what a real buyer post looks like. Go search those, then come to &lt;b&gt;New Lead&lt;\u002Fb&gt; for anyone good.&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-lead&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Qualify and write, for one lead&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Paste what they posted. The tool builds the prompts, your AI does the thinking.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Be respectful with people&#x27;s info:&lt;\u002Fb&gt; only use public posts, never paste anything private or sensitive, keep only what you need, and delete anyone who asks. You&#x27;re reaching out to real people, treat their info the way you&#x27;d want yours treated.&lt;\u002Fdiv&gt;\n &lt;label&gt;Their name or handle&lt;\u002Flabel&gt;&lt;input id=&quot;l-name&quot; placeholder=&quot;e.g. @janesmith or Jane&quot;&gt;\n &lt;label&gt;Platform&lt;\u002Flabel&gt;&lt;select id=&quot;l-platform&quot;&gt;&lt;option&gt;Facebook&lt;\u002Foption&gt;&lt;option&gt;Threads&lt;\u002Foption&gt;&lt;option&gt;Instagram&lt;\u002Foption&gt;&lt;option&gt;LinkedIn&lt;\u002Foption&gt;&lt;option&gt;Upwork&lt;\u002Foption&gt;&lt;option&gt;OnlineJobs.ph&lt;\u002Foption&gt;&lt;option&gt;X (Twitter)&lt;\u002Foption&gt;&lt;option&gt;TikTok&lt;\u002Foption&gt;&lt;option&gt;Other&lt;\u002Foption&gt;&lt;\u002Fselect&gt;\n &lt;label&gt;Paste their post&lt;\u002Flabel&gt;&lt;textarea id=&quot;l-post&quot; placeholder=&quot;Paste exactly what they wrote...&quot;&gt;&lt;\u002Ftextarea&gt;\n &lt;label&gt;What do you want to write?&lt;\u002Flabel&gt;&lt;select id=&quot;l-channel&quot;&gt;&lt;option value=&quot;comment&quot;&gt;A public comment&lt;\u002Foption&gt;&lt;option value=&quot;DM&quot;&gt;A DM&lt;\u002Foption&gt;&lt;option value=&quot;email&quot;&gt;An email&lt;\u002Foption&gt;&lt;option value=&quot;proposal&quot;&gt;An Upwork \u002F OnlineJobs proposal&lt;\u002Foption&gt;&lt;\u002Fselect&gt;\n &lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;genlead&quot;&gt;Build my prompts&lt;\u002Fbutton&gt;&lt;a class=&quot;btn ghost sm&quot; href=&quot;https:\u002F\u002Fchatgpt.com&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open ChatGPT&lt;\u002Fa&gt;&lt;\u002Fdiv&gt;\n &lt;div id=&quot;lead-out&quot;&gt;&lt;\u002Fdiv&gt;\n &lt;div id=&quot;lead-save&quot; style=&quot;display:none&quot;&gt;\n  &lt;label&gt;Paste the message your AI wrote (so you can save and track it)&lt;\u002Flabel&gt;&lt;textarea id=&quot;l-msg&quot; placeholder=&quot;Paste the final message here...&quot;&gt;&lt;\u002Ftextarea&gt;\n  &lt;div class=&quot;row&quot; style=&quot;margin-top:12px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;savelead&quot;&gt;Save to My Leads&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-track&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;My Leads&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Everyone you&#x27;re reaching out to, in one place.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;&lt;b&gt;Important, read once:&lt;\u002Fb&gt; your leads are saved on &lt;b&gt;this device, in this browser only&lt;\u002Fb&gt;. If you clear your browser data, use private mode, or switch to another phone or laptop, they&#x27;re gone unless you exported a backup. So &lt;b&gt;export a backup weekly&lt;\u002Fb&gt;, and keep that file somewhere private (it has real people&#x27;s info, don&#x27;t drop it in a shared cloud folder).&lt;\u002Fdiv&gt;\n &lt;div style=&quot;margin-bottom:12px&quot;&gt;&lt;button class=&quot;btn sm&quot; id=&quot;exportleads&quot;&gt;&amp;#8595; Export backup&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;filt&quot; id=&quot;filt&quot;&gt;&lt;\u002Fdiv&gt;\n &lt;div id=&quot;leads&quot;&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-content&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Make content that pulls leads to you&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Reaching out finds them. Content makes them come to you. Generate posts in your voice.&lt;\u002Fdiv&gt;\n &lt;label&gt;What do you want to make?&lt;\u002Flabel&gt;\n &lt;select id=&quot;c-type&quot;&gt;&lt;option value=&quot;ideas&quot;&gt;10 content ideas that get DMs&lt;\u002Foption&gt;&lt;option value=&quot;hooks&quot;&gt;20 scroll-stopping hooks&lt;\u002Foption&gt;&lt;option value=&quot;caption&quot;&gt;A full caption on a topic&lt;\u002Foption&gt;&lt;\u002Fselect&gt;\n &lt;div id=&quot;c-topic-wrap&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;Topic&lt;\u002Flabel&gt;&lt;input id=&quot;c-topic&quot; placeholder=&quot;e.g. why your website is not booking you calls&quot;&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;gencontent&quot;&gt;Build my content prompt&lt;\u002Fbutton&gt;&lt;a class=&quot;btn ghost sm&quot; href=&quot;https:\u002F\u002Fchatgpt.com&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open ChatGPT&lt;\u002Fa&gt;&lt;\u002Fdiv&gt;\n &lt;div id=&quot;content-out&quot;&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;How to use it:&lt;\u002Fb&gt; copy the prompt into your AI, get your content, then post it where your clients hang out. When someone engages, reach out from the New Lead tab.&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-auto&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Build the engine: how mine actually works&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;This is the part everyone asks about after my reel. Here is the exact architecture of my automated lead engine, and how you build your own version, step by step.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 10px;font-size:15px&quot;&gt;The architecture, 4 layers&lt;\u002Fh3&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;Source.&lt;\u002Fb&gt; Where leads live: Threads, Instagram, Facebook groups, LinkedIn, Upwork. You choose your platforms and niche.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Collect.&lt;\u002Fb&gt; A scraper pulls fresh posts matching your keywords automatically, on a schedule, so you never search by hand.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Think.&lt;\u002Fb&gt; AI scores each post for real buyer intent, filters out scammers and other providers, and drafts a message in your voice.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Act.&lt;\u002Fb&gt; The qualified leads land in your dashboard, ready to review and send. Nothing goes out without your yes.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 10px;font-size:15px&quot;&gt;The real setup behind mine&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;No Zapier template, no paid scraper subscription. Here is what actually runs, plainly:&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;A browser automation that reads for me.&lt;\u002Fb&gt; A small script, running on my own logged-in account, opens the feeds I choose and pulls the recent posts matching my keywords, the same reading I used to do by hand, now on a schedule. I keep it low-volume, human-paced, and only ever on public posts. (Important: this is an advanced, optional step, read the caveat below before you try it.)&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;An AI filter with my
