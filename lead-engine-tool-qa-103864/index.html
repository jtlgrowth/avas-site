 exact rules.&lt;\u002Fb&gt; Every post is scored against the criteria in the next card, real buyer intent in, providers and scammers and clout-bait out, recent only. Anything below the bar never reaches me.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;This dashboard as the destination.&lt;\u002Fb&gt; The survivors land here with a drafted message in my voice, which is the tool you are holding right now. It is the front end of the whole engine.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;A daily scheduler.&lt;\u002Fb&gt; The machine runs it every morning on its own, so a fresh, filtered list is waiting before I open my laptop. No button to press.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n &lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot;&gt;The automated version is real code. Here&#x27;s the part most people don&#x27;t realize, you don&#x27;t have to write it. If you have a paid ChatGPT or Claude, &lt;b&gt;your AI can build it for you.&lt;\u002Fb&gt; That&#x27;s how I built the automated parts of mine, I told the AI what I wanted and it wrote the code. Below is exactly how, if you choose to.&lt;\u002Fdiv&gt;\n &lt;div class=&quot;note&quot; style=&quot;background:color-mix(in srgb,var(--pink) 8%,transparent);border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;Read this before you automate.&lt;\u002Fb&gt; This is an advanced, optional, do-it-at-your-own-risk step. Most platforms&#x27; Terms of Service restrict automated access, and each platform decides what it allows, so check the current Terms first. If you build it: your own logged-in account only, public posts only, tiny volume, human pacing. &lt;b&gt;Never paste your password, cookies, or API keys into the AI chat&lt;\u002Fb&gt;, if it needs a login, you log in yourself in the browser window the script opens. And &lt;b&gt;read any command before you run it&lt;\u002Fb&gt;, don&#x27;t run something you don&#x27;t understand, especially anything with admin or sudo access. When in doubt, stay on the manual method above, it&#x27;s the core of this system and carries none of this risk.&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 6px;font-size:15px&quot;&gt;Got paid ChatGPT or Claude? Build the automated version yourself&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;A paid plan matters here because it can actually write and fix code, and handle the longer back-and-forth. Do these in order. Paste each prompt, then follow what your AI tells you, it will walk you through installing anything you need.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;Set up your AI to code with you.&lt;\u002Fb&gt; Open a paid ChatGPT or Claude. Tell it you want to build a small automation on your computer and that you&#x27;re not a coder, so it should explain every step and give exact commands.\n    &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Prompt 1 &amp;middot; get set up&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;I want to build a small tool on my own computer that finds leads for me automatically. I am not a developer, so explain every step simply and give me the exact commands to copy. First, tell me what free things I need to install to run a script, and walk me through installing them one at a time.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Build the reader.&lt;\u002Fb&gt; Have it write a script that opens the platform you choose, logged in as you, and pulls recent posts matching your keywords.\n    &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Prompt 2 &amp;middot; the reader&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Now write me a script that opens [PLATFORM] in a browser I control, logged in as myself, and collects the recent posts that match these keywords: [YOUR KEYWORDS from the Find tab]. Only posts from the last 3 days. Save each post&#x27;s text, author handle, and link into a file. Explain how to run it, remind me of the platform&#x27;s Terms and any rate limits I should respect, and keep it low-volume and human-paced.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Add your filter.&lt;\u002Fb&gt; Feed it your exact filter rules from the Build Guide so it only keeps real buyers.\n    &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Prompt 3 &amp;middot; the filter&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Add a step that sends each saved post to the AI and keeps only real buyers, using these rules: GREEN keep = asking for help\u002Frecommendations, describing a problem I solve, hiring, asking rates. RED drop = other providers advertising, scams, clout bait, job seekers, anything older than 3 days. For each kept post also draft a short outreach message in my voice. Save the winners to a clean file.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Send it to your dashboard.&lt;\u002Fb&gt; Have it export the winners so you can load them into this tool.\n    &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Prompt 4 &amp;middot; connect the dashboard&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Export the final qualified leads as a simple list I can copy, one lead per line with the handle, the post link, and the drafted message, so I can paste them into my lead dashboard each morning.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Put it on a schedule.&lt;\u002Fb&gt; Ask it to make the whole thing run by itself every morning.\n    &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Prompt 5 &amp;middot; automate it&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Now show me how to make this whole thing run automatically every morning on my computer, step by step, with the exact settings. Remind me of the platform&#x27;s Terms and rate limits first, and keep it low-volume and human-paced.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;b&gt;Be responsible with it:&lt;\u002Fb&gt; your own account only, public posts only, low volume, human pacing, and respect each platform&#x27;s Terms. Used carelessly, automation can get an account restricted, so if you&#x27;re unsure, stay on the manual method.&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The exact tools I use (and what&#x27;s free vs paid)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;No mystery stack. Here is literally what I run, layer by layer, and what it costs, so you know what you&#x27;re signing up for before you touch anything.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;&lt;strong&gt;The thinking + writing: ChatGPT and Claude.&lt;\u002Fstrong&gt; This is the brain that scores posts, drafts outreach in my voice, and answers my questions. A paid plan runs roughly ₱1,000 to ₱1,400 a month. Both have a free tier that&#x27;s enough to start and test.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;The builder: Claude Code (and Codex).&lt;\u002Fstrong&gt; These are AI coding assistants that actually write and run the automation for me on my own computer. I am not sitting there coding, I tell it what I want in plain English and it builds it. Claude Code is Anthropic&#x27;s, Codex is OpenAI&#x27;s. You only need ONE, and you only need it if you decide to automate. Manual runs on the free tools above.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;The reader: a small browser script.&lt;\u002Fstrong&gt; A tiny automation (the coding assistant writes it for you) that opens the feeds I choose, logged in as me, and pulls the recent posts matching my keywords. Free to run, it lives on my own computer. Advanced and optional, read the safety note above first.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;The destination: this dashboard.&lt;\u002Fstrong&gt; Where the qualified leads land, ready to review and send. Free, no subscription, you&#x27;re holding it.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;The scheduler: your computer&#x27;s built-in timer.&lt;\u002Fstrong&gt; Makes the whole thing run every morning on its own. Free, already on your machine, the coding assistant sets it up.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot;&gt;The only real cost in this whole system is one AI plan. Everything else is free or already on your computer. And if you stay manual, a free AI account is genuinely enough to run this.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;No-code path vs code path&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;There are two ways to run this, and neither one is the &quot;wrong&quot; one. Pick based on your time and your tolerance for tinkering.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;&lt;strong&gt;No-code path:&lt;\u002Fstrong&gt; you use this dashboard manually. You find leads, paste them in, review the scores, send the messages yourself. Zero code, zero setup delay. You can start today, right now, with what you already have open.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Code path:&lt;\u002Fstrong&gt; you use the prompts above with Claude Code or Codex to build the automation, so leads show up on their own every morning. This needs a paid AI plan and a bit more patience while it&#x27;s being built.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot;&gt;The manual path is not the &quot;starter&quot; version you graduate out of. It&#x27;s the actual system. Automation just removes you from the repetitive part of it. Plenty of people run this manually and never automate a thing, and it still works.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;Start smaller than you think (your MVP engine)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Don&#x27;t build the whole thing on day one. Here&#x27;s the smallest version that still counts as a working engine.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;Pick one source. One Facebook group or one search term. Not five.&lt;\u002Fli&gt;\n    &lt;li&gt;Collect 10 leads by hand this week. Just 10.&lt;\u002Fli&gt;\n    &lt;li&gt;Run them through the filter once, manually, using this dashboard.&lt;\u002Fli&gt;\n    &lt;li&gt;Message the top 3. See what happens.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;That&#x27;s it. That&#x27;s the MVP. Once that loop feels normal, add a second source, then automate the parts that bore you. You&#x27;re not behind for starting this small. This small is the point.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;When it breaks: common problems and fixes&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Something will go sideways at some point. Here&#x27;s what usually breaks and the fix, so it doesn&#x27;t feel like a crisis when it happens.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;&lt;strong&gt;Leads dry up:&lt;\u002Fstrong&gt; your source has gone quiet or you&#x27;ve exhausted it. Add a second source instead of squeezing the first one harder.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;AI keeps mis-scoring people:&lt;\u002Fstrong&gt; your filter prompt is too vague. Go back and add 2 to 3 real examples of a good lead versus a bad one, straight into the prompt.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;You get an account warning:&lt;\u002Fstrong&gt; slow down. Space out your collection, stay under the platform&#x27;s normal usage patterns, and reread the safety note above before you touch it again.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Too many leads, not enough hours:&lt;\u002Fstrong&gt; raise your filter&#x27;s bar. You don&#x27;t need every lead. You need the top 20 percent you can actually follow up with well.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Your outreach messages sound robotic:&lt;\u002Fstrong&gt; stop sending the AI&#x27;s first draft. Read it out loud, then rewrite one line in your own voice before you send it.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;What to realistically expect (timeline)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;No promises here, just what building this actually feels like, week by week, so you don&#x27;t think you&#x27;re doing it wrong.&lt;\u002Fp&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n    &lt;li&gt;&lt;strong&gt;Week 1:&lt;\u002Fstrong&gt; mostly setup and confusion. You&#x27;ll re-read the prompts twice. Normal.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Week 2:&lt;\u002Fstrong&gt; your manual MVP is running. It feels slow and a little manual, because it is.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Week 3:&lt;\u002Fstrong&gt; patterns start showing up. You know which sources are actually worth your time.&lt;\u002Fli&gt;\n    &lt;li&gt;&lt;strong&gt;Week 4:&lt;\u002Fstrong&gt; you&#x27;re either automating the boring parts or you&#x27;ve decided manual works fine for you. Both are a win.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot;&gt;This is a system you build a habit around, not a machine you flip on. Give it a month before you judge it.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;Want it done WITH you instead of figuring it out solo?&lt;\u002Fb&gt;&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;That&#x27;s the 2-day workshop, we build your reader, your AI filter tuned to your exact niche, this dashboard, and the daily schedule together, live and safely, plus your own AI employees. Same engine, just with me in the room so nothing breaks. This tab is the map. The workshop is us walking it together.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;promo&quot;&gt;\n &lt;div class=&quot;k2&quot;&gt;&amp;#127903;&amp;#65039; Your buyer bonus&lt;\u002Fdiv&gt;\n &lt;h4&gt;50% OFF the 2-day live AI Workshop&lt;\u002Fh4&gt;\n &lt;p&gt;Because you got the Blueprint, you get half off my in-person workshop, where we build your full automated engine and your own AI employees together, live.&lt;\u002Fp&gt;\n &lt;div class=&quot;code&quot;&gt;&lt;b&gt;AIWORKSHOP50&lt;\u002Fb&gt;&lt;button onclick=&quot;if(navigator.clipboard){navigator.clipboard.writeText(&#x27;AIWORKSHOP50&#x27;)}this.textContent=&#x27;Copied \\u2713&#x27;;this.classList.add(&#x27;ok&#x27;)&quot;&gt;Copy code&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;p&gt;Use it when you grab your seat. Join the waitlist first to get the dates and founding price before anyone else.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-army&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Build your own AI army&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Real talk, the only reason I pulled this whole thing off is my team. Not a big agency, an &lt;b&gt;AI army&lt;\u002Fb&gt;, little AI employees I built, each with one job, that do the work with me every day. Here&#x27;s how I build them, guide-level. Enough to build your first few. The deep, connect-them-all-together part is what we do live in the workshop.&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;What an &quot;AI employee&quot; actually is&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Forget &quot;agents&quot; for a sec. Think of it like hiring. An AI employee is just an AI you&#x27;ve given &lt;b&gt;one clear job, a set of rules, and your voice&lt;\u002Fb&gt;, once, so it does that job the same way every single time without you re-explaining. One for finding leads. One for writing content. One for replies. Stack a few and that&#x27;s your army.&lt;\u002Fp&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;How I build one, step by step&lt;\u002Fh3&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;&lt;b&gt;Pick ONE annoying, repeatable task.&lt;\u002Fb&gt; Not ten. One. The thing you do over and over that drains you, like qualifying leads or drafting captions.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Write its job description.&lt;\u002Fb&gt; This is the whole secret, treat it like onboarding a new hire, not typing a prompt. Who it is, its one goal, the rules it must follow, and your voice. Use the starter below.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Show it, don&#x27;t just tell it.&lt;\u002Fb&gt; Paste 2 or 3 examples of a great result and a bad one. AI copies your examples more than your instructions.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Test and correct, like training a new hire.&lt;\u002Fb&gt; Run it, and when it gets something wrong, tell it exactly what you wanted instead. Fold that correction back into the job description.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Save it so it&#x27;s reusable.&lt;\u002Fb&gt; Turn it into a Custom GPT, a Claude Project, or just a saved prompt doc you reuse. Now it&#x27;s a real employee, not a one-off chat.&lt;\u002Fli&gt;\n   &lt;li&gt;&lt;b&gt;Hire the next one.&lt;\u002Fb&gt; Repeat for the next task. One employee per job. Before long you&#x27;ve got a little team running beside you. That&#x27;s the army.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The starter &quot;job description&quot; I use&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Fill this in and paste it as the very first message (or the custom instructions) for a new AI employee:&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;AI employee job description&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;You are my [ROLE, e.g. lead-qualifier \u002F content writer]. Your one job is [THE GOAL in one sentence].\n\nAlways follow these rules:\n- [rule 1, e.g. only flag real buyers, never other providers]\n- [rule 2]\n- [rule 3]\n\nMy voice: [paste 2 or 3 of your own sentences so it sounds like you].\n\nHere is what a GREAT result looks like: [paste example].\nHere is a BAD result to avoid: [paste example].\n\nBefore you answer, ask me anything you need to do this well. When you&#x27;re ready, wait for my input.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;Start with the lead-qualifier, you already have its rules in the &lt;b&gt;Build Guide&lt;\u002Fb&gt; and &lt;b&gt;Handbook&lt;\u002Fb&gt;. That&#x27;s your first hire, done today.&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Where I stop, on purpose:&lt;\u002Fb&gt; this gets you real, working AI employees you build one by one. What I don&#x27;t hand over as a file is how I &lt;b&gt;connect them into one system that runs on its own&lt;\u002Fb&gt;, the orchestration, the hand-offs, the always-on setup, the &quot;Venice&quot; layer that ties my whole team together. That&#x27;s not gatekeeping for the sake of it, it&#x27;s the part that has to be built around your exact business, and it&#x27;s genuinely the work. That&#x27;s the workshop.&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The Lead Qualifier (ready to paste)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;This was the first employee I ever built, because I was tired of scrolling through comments trying to figure out who actually wanted help and who was just talking. Copy this whole thing, paste it into your AI tool, fill in the one bracket, and it starts sorting for you today.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;\n    &lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Job Description: Lead Qualifier&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n    &lt;pre&gt;ROLE: You are my Lead Qualifier. Your only job is to read posts, comments, and DMs and tell me who is a real lead and who is noise.\n\nGOAL: Score everything I send you as GREEN (reach out now), RED (skip it), or YELLOW (not sure), using the rules below. Never guess silently.\n\nRULES:\n1. GREEN = the person names a real problem related to [YOUR SERVICE], asks a question about it, or vents about it with no solution in place.\n2. GREEN = the person clearly runs a business (bio, website, or recent posts prove it) and looks able to pay for help.\n3. RED = it&#x27;s a rant with no business behind it, a competitor fishing for info, or someone who already has a team doing this.\n4. RED = the post is more than 5 days old. Leads go cold fast, we don&#x27;t chase ghosts.\n5. Whatever you score, give me one sentence why. I want your reasoning, not just a label.\n\nVOICE: N\u002FA. This employee doesn&#x27;t write, it only scores.\n\nEXAMPLE:\nPost: &quot;I know I need to post more but I have zero time and my content looks nothing like me.&quot;\nGREEN. Real problem, no solution in place, sounds like a founder, not a competitor.\n\nPost: &quot;Just hit 10k followers, thank you to my amazing team!&quot;\nRED. Already has support. This is a celebration post, not a pain point.&lt;\u002Fpre&gt;\n  &lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;Fill in [YOUR SERVICE], leave the rest exactly as is. This is the same logic I use to filter my own leads every day.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The Content Writer (ready to paste)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;This one turns my messy voice notes and bullet points into an actual post, in my voice, not a version of me that sounds like everyone else on the internet. You still review before it goes out. It&#x27;s a first draft machine, not an autopilot.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;\n    &lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Job Description: Content Writer&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n    &lt;pre&gt;ROLE: You are my Content Writer. Your job is to turn my raw thoughts, voice notes, or bullet points into a finished post that sounds like me, not like a template.\n\nGOAL: Write one complete post (hook, body, CTA) from whatever I give you, ready for me to review.\n\nRULES:\n1. Open with a hook that could double as a text message to a friend. No fake questions nobody actually asks out loud.\n2. Write in this voice: [VOICE PLACEHOLDER, e.g. direct, a little blunt, warm underneath].\n3. One idea per post. If I give you three thoughts, pick the strongest one and save the rest, don&#x27;t cram everything in.\n4. End with a CTA that matches my past CTAs exactly, not a generic &quot;DM me to learn more!&quot;\n5. Never use these words: unlock, elevate, moving forward, honestly, let&#x27;s be honest.\n\nVOICE: [Paste 3-5 of your own real captions here so it has something true to copy from.]\n\nEXAMPLE:\nBad: &quot;Are you struggling with consistency in today&#x27;s fast-paced business world? Let&#x27;s unlock your potential together!&quot;\nGood: &quot;I didn&#x27;t lose clients because my content was bad. I lost them because I disappeared for three weeks and called it &#x27;busy season.&#x27;&quot;&lt;\u002Fpre&gt;\n  &lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;The voice section is the whole game here. Paste your real captions, not a description of your voice. It writes better when it has proof, not adjectives.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The Reply Responder (ready to paste)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;This one drafts replies so nobody sits on read for three days, but it never hits send without me. Warm, human, and it knows the difference between a comment that needs a question back and one that needs a follow-up later.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;\n    &lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Job Description: Reply Responder&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n    &lt;pre&gt;ROLE: You are my Reply Responder. You draft warm replies to comments and DMs so I never leave people on read, but you never hit send without me reviewing first.\n\nGOAL: Draft a reply that sounds like a real person answered, not a script, and flag anything that needs a follow-up.\n\nRULES:\n1. Match their energy. If they wrote three excited sentences, don&#x27;t reply with one flat line.\n2. Ask one genuine question back when it fits. People keep talking when you ask them something real.\n3. Never pitch in the first reply. Build the conversation first, the offer comes after they&#x27;ve actually talked to me.\n4. If a warm conversation goes quiet for 2-3 days, draft a no-pressure follow-up, not a &quot;just checking in!&quot;\n5. Flag anything that reads like a real lead so I see it fast. Don&#x27;t let it sit in a queue with everything else.\n\nVOICE: [Paste 3-5 of your real DM replies here so it learns how you actually talk to people.]\n\nEXAMPLE:\nBad: &quot;Thanks for reaching out! Feel free to check out our services page for more info.&quot;\nGood: &quot;Okay this made me laugh, you basically described my Tuesday. Is it more of a &#x27;no time&#x27; problem or a &#x27;don&#x27;t know what to say&#x27; problem right now?&quot;&lt;\u002Fpre&gt;\n  &lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;This is the employee people notice first, because it&#x27;s the one their leads actually talk to. Give it more voice examples than you think you need.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;How to tell an employee is ready to trust&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;You don&#x27;t hand over the keys because you&#x27;re excited. You hand them over because it&#x27;s earned it. Run every new employee through this before you let it touch anything real.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;\n    &lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Checklist&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n    &lt;pre&gt;1. You&#x27;ve tested it on at least 10-15 real examples, not 2 or 3.\n2. When it&#x27;s wrong, it&#x27;s wrong in a small, obvious way, not confidently wrong.\n3. You can predict what it&#x27;ll say before it says it, that means the rules actually landed.\n4. It flags when it&#x27;s unsure instead of guessing and moving on.\n5. You&#x27;ve corrected it at least once and it held the correction the next time.&lt;\u002Fpre&gt;\n  &lt;\u002Fdiv&gt;\n  &lt;div class=&quot;note&quot;&gt;If it fails even one of these, it&#x27;s not broken, it just needs clearer rules. Go back and get specific, vague instructions make vague employees.&lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n&lt;div class=&quot;card&quot;&gt;\n  &lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;The 3 mistakes that make an AI employee useless&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;I made all three of these before I figured out what actually works. Save yourself the time.&lt;\u002Fp&gt;\n  &lt;div class=&quot;blk&quot;&gt;\n    &lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;What kills it&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n    &lt;pre&gt;1. GIVING IT TOO MANY JOBS AT ONCE\nOne employee, one job. The Lead Qualifier doesn&#x27;t also write your captions. The second you stack jobs, it gets worse at all of them, not better at any of them.\n\n2. WRITING VAGUE RULES\n&quot;Sound professional&quot; means nothing to an AI. &quot;Open with a question, keep sentences under 15 words, never use exclamation points&quot; means something. Specific rules, specific results.\n\n3. NEVER CORRECTING IT\nIf it gets something wrong and you just work around it instead of fixing the instructions, it&#x27;ll keep getting it wrong forever. The correction is the whole point, that&#x27;s how it actually learns your standards.&lt;\u002Fpre&gt;\n  &lt;\u002Fdiv&gt;\n&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;Want to build your whole AI team WITH me, live?&lt;\u002Fb&gt;&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;In the 2-day workshop we build your AI employees together and wire them into one running system, the same way I built mine. You leave with your own little army, not just the idea of one.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;promo&quot;&gt;\n &lt;div class=&quot;k2&quot;&gt;&amp;#127903;&amp;#65039; Your buyer bonus&lt;\u002Fdiv&gt;\n &lt;h4&gt;50% OFF the 2-day live AI Workshop&lt;\u002Fh4&gt;\n &lt;p&gt;Because you got the Blueprint, you get half off my in-person workshop, where we build your full automated engine and your own AI employees together, live.&lt;\u002Fp&gt;\n &lt;div class=&quot;code&quot;&gt;&lt;b&gt;AIWORKSHOP50&lt;\u002Fb&gt;&lt;button onclick=&quot;if(navigator.clipboard){navigator.clipboard.writeText(&#x27;AIWORKSHOP50&#x27;)}this.textContent=&#x27;Copied \\u2713&#x27;;this.classList.add(&#x27;ok&#x27;)&quot;&gt;Copy code&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;p&gt;Use it when you grab your seat. Join the waitlist first to get the dates and founding price before anyone else.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-book&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;Handbook, templates &amp; scripts&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;Everything I&#x27;ve got, organized so you actually use it. Tap what you need, skip the rest.&lt;\u002Fdiv&gt;\n \n&lt;details&gt;&lt;summary&gt;The method (4 steps)&lt;\u002Fsummary&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;&lt;b&gt;Find&lt;\u002Fb&gt; people already asking for what you sell.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Filter&lt;\u002Fb&gt; the real buyers from scammers and time-wasters.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Write&lt;\u002Fb&gt; a personal message in your voice.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Follow up&lt;\u002Fb&gt; so no one slips.&lt;\u002Fli&gt;&lt;\u002Fol&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Safe outreach rules (don&#x27;t get your account flagged)&lt;\u002Fsummary&gt;&lt;ul style=&quot;padding-left:18px;font-size:13.5px&quot;&gt;&lt;li&gt;&lt;b&gt;New account:&lt;\u002Fb&gt; start at 5 to 10 actions a day, ramp up slowly over a few weeks. A brand-new account that suddenly sends 100 messages is the fastest way to get restricted.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Established account:&lt;\u002Fb&gt; you can go higher, but keep it human, spread through the day, not 50 in one burst.&lt;\u002Fli&gt;&lt;li&gt;Vary every message, never paste the exact same text twice.&lt;\u002Fli&gt;&lt;li&gt;Watch your accept\u002Freply ratio. If almost no one is responding, stop and fix the message before sending more, low engagement is what platforms flag.&lt;\u002Fli&gt;&lt;li&gt;On public comments keep it short, send links in the DM.&lt;\u002Fli&gt;&lt;li&gt;Lead with a real reference to their post, not a pitch.&lt;\u002Fli&gt;&lt;li&gt;Prove it by hand first. Don&#x27;t automate a channel until you&#x27;ve closed a client or two on it manually, automate what already works.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Where to find clients (platform guide)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;&lt;b&gt;Facebook &amp; Groups:&lt;\u002Fb&gt; search &quot;looking for&quot;, &quot;need help with&quot; inside niche and local business groups.&lt;\u002Fp&gt;&lt;p&gt;&lt;b&gt;Threads &amp; Instagram:&lt;\u002Fb&gt; search intent phrases and hashtags, reply then DM.&lt;\u002Fp&gt;&lt;p&gt;&lt;b&gt;LinkedIn:&lt;\u002Fb&gt; content search &quot;looking for a [role]&quot;, comment, connect, message.&lt;\u002Fp&gt;&lt;p&gt;&lt;b&gt;Upwork &amp; OnlineJobs.ph:&lt;\u002Fb&gt; the warmest, they are hiring. Filter by your service and send a tailored proposal.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Comment templates&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;[FIRST NAME] okay this is the exact problem I fix for people, and it&#x27;s way more fixable than it feels right now. Happy to share what&#x27;s worked if you want it.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;This is such a common snag and most people don&#x27;t realize how close the fix actually is. If you want a couple of ideas, I&#x27;m around.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 3&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;[FIRST NAME] I read this twice. This is genuinely my zone, would love to help if you&#x27;re still in it.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 4&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Ok this is my whole world lol. If you want a second brain on this, I&#x27;ve got thoughts.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 5&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;You&#x27;re closer to solving this than it feels like right now. Happy to point you somewhere useful if that&#x27;d help.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Comment 6&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;[FIRST NAME] this is such a good question, and there&#x27;s a real answer here, not just &#x27;post more.&#x27; Would love to help you think it through.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;DM templates&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;DM 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hey [FIRST NAME], your post has been sitting with me since I saw it. I work with people on exactly this, not pitching, just wanted to say it&#x27;s more solvable than it feels and say hi.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;DM 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [FIRST NAME], I help people fix this, usually faster than they expect. If it&#x27;s still an open problem for you, I&#x27;d love to send over how I&#x27;d approach it. Want me to?&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;DM 3&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hey [FIRST NAME], no agenda, just saw your post and it reminded me of the work I do. If now&#x27;s not the time, totally fine, just wanted you on my radar for when it is.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;DM 4&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [FIRST NAME], saw you&#x27;re looking for help with this specifically, that&#x27;s exactly my thing. I&#x27;ve got real experience doing this and could start soon. Want me to send over my rates or portfolio?&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;DM 5&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;[FIRST NAME] I don&#x27;t usually DM off a post but this one was too on the nose. I do this for a living. If you want a straight answer instead of a sales pitch, I&#x27;ve got five minutes.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;LinkedIn templates&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;LinkedIn 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [FIRST NAME], saw your post and wanted to connect, it&#x27;s exactly the kind of work I do. Would love to stay in each other&#x27;s orbit.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;LinkedIn 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hey [FIRST NAME], thanks for connecting. I do this for people day to day, and your post got me thinking about a specific way I&#x27;d approach it. Want me to send it over, no strings attached?&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Email templates&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Email 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Subject: quick note about your post\n\nHi [FIRST NAME],\n\nI came across your post and had to reach out. I work with people on exactly this, specifically the part where it stops being a content problem and starts being a strategy one.\n\nNo pitch here, just wanted to introduce myself in case it&#x27;s useful down the line.\n\nIf you want to see how I work, here&#x27;s [LINK].\n\n[YOUR NAME]&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Email 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Subject: saw this and thought of you, [FIRST NAME]\n\nHi [FIRST NAME],\n\nYou mentioned something that&#x27;s more common than people think, and there&#x27;s a fix most people skip. [SHORT VALUE \u002F TIP].\n\nThat&#x27;s basically what I do for a living. If you ever want a second set of hands on it, I&#x27;m here.\n\n[LINK]\n\n[YOUR NAME]&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Email 3&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Subject: circling back, [FIRST NAME]\n\nHi [FIRST NAME],\n\nWanted to check back in on this. Timing matters more than anything, so if now isn&#x27;t it, just say the word and I&#x27;ll leave it be.\n\nIf you are ready, here&#x27;s what working together would actually look like: [YOUR OFFER SUMMARY].\n\n[LINK]\n\n[YOUR NAME]&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Upwork \u002F OnlineJobs proposals&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Proposal 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [CLIENT NAME],\n\nRead through your post twice, this is exactly the kind of work I do. I&#x27;ve handled similar projects before and can start [AVAILABILITY].\n\nHere&#x27;s roughly how I&#x27;d approach yours: [1-2 LINE PLAN SPECIFIC TO THEIR POST].\n\nHappy to hop on a quick call if that&#x27;s easier, or you can look through my work here: [LINK].\n\n[YOUR NAME]&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Proposal 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [CLIENT NAME],\n\nKeeping this short since I know you&#x27;re reading a stack of these. I&#x27;ve got [YEARS\u002FRELEVANT EXPERIENCE], I&#x27;m available [AVAILABILITY], and I&#x27;ve delivered something close to what you&#x27;re asking for before.\n\nCan send samples or jump on a call, whichever&#x27;s faster for you.\n\n[YOUR NAME]\n[LINK]&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Follow-up templates&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Follow-up 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hey [FIRST NAME], floating this back up in case it got buried under everything else. No worries if the timing&#x27;s off, just didn&#x27;t want you to miss it.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Follow-up 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [FIRST NAME], while this was on my mind I put together a quick idea related to your post. Figured I&#x27;d send it either way, whether or not we end up working together.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Follow-up 3&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hey [FIRST NAME], last note from me on this one, promise. If it&#x27;s not a fit right now, all good, the door stays open for whenever it is.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Follow-up 4&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Hi [FIRST NAME], it&#x27;s been a minute so this might be old news, but wanted to check if this is still something you&#x27;re dealing with. Happy to pick it back up whenever you are.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Objection handling&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Objection 1&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;When they say: how much?\n\nGood question, and I&#x27;d rather give you a real number than a vague one. It depends on scope, but here&#x27;s a general range: [PRICE RANGE]. Once I know a bit more about what you need, I can get specific. Want to hop on a quick call, or should I just send over packages?&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Objection 2&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;When they say: not right now \u002F no budget\n\nTotally get it, timing runs the show. No pressure at all, I&#x27;ll leave the door open. If it helps, I can send over something useful in the meantime so you&#x27;re not starting from zero when the timing&#x27;s right.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Objection 3&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;When they say: I&#x27;ll think about it \u002F ghosting\n\nNo rush, take whatever time you need. I&#x27;ll check back in down the line, but feel free to reach out first whenever it makes sense on your end. Here&#x27;s [LINK] if you want to look through anything while you decide.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Objection 4&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;When they say: can you send samples?\n\nOf course, here&#x27;s my work: [LINK]. Let me know if you want something closer to your specific niche or project, I&#x27;ve got more I can send.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Niche + keyword bank&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Search phrases people use when they need help. Swap in your niche.&lt;\u002Fp&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Social\u002Fcontent:&lt;\u002Fb&gt; &quot;looking for a social media manager&quot;, &quot;need help with my instagram&quot;, &quot;hiring a content creator&quot;, &quot;need a reels editor&quot;&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Websites\u002Ffunnels:&lt;\u002Fb&gt; &quot;looking for a web designer&quot;, &quot;need a website&quot;, &quot;recommend a webflow person&quot;, &quot;need a landing page&quot;&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;VA\u002Fops:&lt;\u002Fb&gt; &quot;looking for a virtual assistant&quot;, &quot;drowning in DMs&quot;, &quot;need admin help&quot;&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;AI\u002Fautomation:&lt;\u002Fb&gt; &quot;need to automate&quot;, &quot;want to add AI to my business&quot;, &quot;need a chatbot&quot;&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Design:&lt;\u002Fb&gt; &quot;need a graphic designer&quot;, &quot;looking for a canva person&quot;, &quot;need brand design&quot;&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;p&gt;Run the Find tab to expand this for your exact niche.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Scam + time-waster red flags&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Skip or be careful if you see:&lt;\u002Fp&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Fast money, crypto, forex, &quot;DM to earn&quot;, giveaways.&lt;\u002Fli&gt;&lt;li&gt;They are looking for work, not hiring (job seekers).&lt;\u002Fli&gt;&lt;li&gt;Another provider advertising the same service you offer.&lt;\u002Fli&gt;&lt;li&gt;Engagement bait (&quot;comment YES&quot;, &quot;tag 3 friends&quot;).&lt;\u002Fli&gt;&lt;li&gt;Vague &quot;building something big&quot; with no detail or budget.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;p&gt;Real buyers name a specific problem, a specific outcome, and a hint of seriousness.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;How to price and package&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You already know the basics. Here&#x27;s the version that actually moves the number:&lt;\u002Fp&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Price the outcome, not your hours. Name what the result is worth before you name the fee.&lt;\u002Fli&gt;&lt;li&gt;Anchor high, never open with your lowest number.&lt;\u002Fli&gt;&lt;li&gt;Package into a retainer, recurring beats one-off every time.&lt;\u002Fli&gt;&lt;li&gt;Use the 3-tier proposal below, and make the middle tier the obvious yes.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;AI tools cheat sheet&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Writing &amp; thinking:&lt;\u002Fb&gt; ChatGPT, Claude.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Building:&lt;\u002Fb&gt; Codex and AI coding tools, simple tools and scripts.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Automation:&lt;\u002Fb&gt; Make, Zapier, n8n.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Agents:&lt;\u002Fb&gt; Custom GPTs, give a task once, it repeats.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Design &amp; media:&lt;\u002Fb&gt; AI image, video and voice tools.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Organize:&lt;\u002Fb&gt; Notion plus AI for your tracker and SOPs.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;p&gt;Start with one from each row. You do not need all of them.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Client onboarding message (send once they say yes)&lt;\u002Fsummary&gt;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;Onboarding message&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;Yay, so excited to work with you, [FIRST NAME]!\nTo get us started, a few quick things:\n1. What does a win look like for you in the next 90 days?\n2. Any brand assets, logins or examples I should have?\n3. Best way and time to reach you?\nHere is how payment and next steps work: [YOUR PROCESS].\nI will send a short plan by [DATE]. Let&#x27;s build.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Your 7-day quick-start plan&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;&lt;b&gt;Day 1:&lt;\u002Fb&gt; Fill in Setup. Pick one platform.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Day 2:&lt;\u002Fb&gt; Run Find, gather 15 posts, filter to your best 10.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Day 3-6:&lt;\u002Fb&gt; Reach out to 5 to 10 a day, log them, follow up after 2 days.&lt;\u002Fli&gt;&lt;li&gt;&lt;b&gt;Day 7:&lt;\u002Fb&gt; Review My Leads. Double down on what got replies.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;p&gt;Do this one week and you&#x27;ll have run the full loop end to end, with real conversations started.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Close high-ticket clients (₱50k and up)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;\n&lt;p&gt;&lt;b&gt;The discovery call, 4 moves:&lt;\u002Fb&gt;&lt;\u002Fp&gt;\n&lt;ol style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Ask about their goal and what is not working right now. Let them talk more than you do.&lt;\u002Fli&gt;&lt;li&gt;Reflect it back so they feel understood.&lt;\u002Fli&gt;&lt;li&gt;Show the gap between where they are and where they want to be.&lt;\u002Fli&gt;&lt;li&gt;Present your package as the bridge, priced to the outcome, not the hours.&lt;\u002Fli&gt;&lt;\u002Fol&gt;\n&lt;p&gt;&lt;b&gt;Anchor high:&lt;\u002Fb&gt; name the full value before the price. &quot;A client like this is usually worth ₱50k and up to you. The package to get you there is [X].&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;When they hesitate on price:&lt;\u002Fb&gt; &quot;Totally fair. Quick question, if this brought you even one new client, would it pay for itself?&quot; Then go quiet and let them answer.&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Close:&lt;\u002Fb&gt; &quot;Want me to send the plan so we can start on [date]?&quot; Assume the yes, make it easy to say.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Your 3-tier proposal, ready to fill in (₱50k and up)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;\n&lt;p&gt;Copy this, rename the tiers, drop in your numbers. Most people say yes to the middle, so make it the obvious pick.&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Open with the outcome, not the price:&lt;\u002Fb&gt; &quot;Here&#x27;s what getting [RESULT] is worth to you: [ANCHOR NUMBER]. Here are three ways we can get there.&quot;&lt;\u002Fp&gt;\n&lt;ol style=&quot;padding-left:18px&quot;&gt;\n&lt;li&gt;&lt;b&gt;Foundation, [₱X].&lt;\u002Fb&gt; The essential scope that solves the core problem. [1 to 2 key deliverables].&lt;\u002Fli&gt;\n&lt;li&gt;&lt;b&gt;Growth, [₱XX], most popular.&lt;\u002Fb&gt; Everything in Foundation plus the pieces that actually move their number. This is your &quot;if you&#x27;re serious&quot; tier, and the one you point to.&lt;\u002Fli&gt;\n&lt;li&gt;&lt;b&gt;Partner, [₱XXX].&lt;\u002Fb&gt; Higher touch, priority and speed, for the client who wants it handled. [premium extras].&lt;\u002Fli&gt;\n&lt;\u002Fol&gt;\n&lt;p&gt;&lt;b&gt;State the terms plainly:&lt;\u002Fb&gt; deposit to start (e.g. 50% upfront), retainer billed monthly, what&#x27;s included versus a new scope item, how add-ons get priced.&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Scope-lock line to paste into the proposal:&lt;\u002Fb&gt; &quot;This covers [X]. Anything outside it is a new line item we price separately before we start, so we both always know what&#x27;s in scope.&quot;&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Objection replies beyond price&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;\n&lt;p&gt;&lt;b&gt;&quot;I already have someone for this.&quot;&lt;\u002Fb&gt; &quot;Love that, and I&#x27;m not here to replace what&#x27;s working. A lot of my clients kept their existing setup and brought me in for [the specific gap]. Want me to show you where I&#x27;d add, not overlap?&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;&quot;Let me run it by my partner \u002F team.&quot;&lt;\u002Fb&gt; &quot;Totally, that&#x27;s the right call. To make that easy, want me to put the one-page version together so you&#x27;re not the one explaining it? I can include the exact ROI so the conversation is quick.&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;&quot;Can you guarantee results?&quot;&lt;\u002Fb&gt; &quot;I won&#x27;t insult you with a fake guarantee. What I can show you is exactly how I work, the checkpoints where we&#x27;ll know it&#x27;s landing, and what we adjust if it isn&#x27;t. That&#x27;s the honest version, and it&#x27;s why my clients stay.&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;&quot;Why you and not an agency?&quot;&lt;\u002Fb&gt; &quot;With an agency you get a team and a queue. With me you get the person who actually does the thinking, faster, and no account-manager telephone game. For [their situation], that speed is the point.&quot;&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Mine the clients you already have (reactivation + referrals)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;\n&lt;p&gt;You already have a book of business. That&#x27;s higher-leverage than any cold DM. Use it.&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Reactivate a past client:&lt;\u002Fb&gt; &quot;Hi [FIRST NAME], you crossed my mind today. I&#x27;ve since built [what&#x27;s new], and it made me think of [their goal from before]. No pitch, just, if it&#x27;s still on your list, I&#x27;d love to catch up. Open to it?&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Ask a happy client for a warm intro (specific, not &quot;know anyone?&quot;):&lt;\u002Fb&gt; &quot;Quick favour, [FIRST NAME]. I&#x27;m opening [N] spots this quarter for [exact type of person]. Who&#x27;s one person in your circle who fits that and would thank you for the intro? Happy to make you look good with a message you can just forward.&quot;&lt;\u002Fp&gt;\n&lt;p&gt;&lt;b&gt;Turn a testimonial into a referral:&lt;\u002Fb&gt; after they praise you, reply: &quot;That means a lot. If you know one other [type] who needs this, I&#x27;d love an intro, and I&#x27;ll take great care of them like I did with you.&quot;&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Pre-call diagnostic (send before the discovery call)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;\n&lt;p&gt;Send this before they book, or right after. It pre-qualifies budget, pre-frames you as the expert, and turns the call into an audit instead of a pitch.&lt;\u002Fp&gt;\n&lt;p&gt;&quot;Before we hop on, three quick things so I can make our time useful:&lt;\u002Fp&gt;\n&lt;ol style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;What&#x27;s the goal in the next 90 days?&lt;\u002Fli&gt;&lt;li&gt;What have you already tried, and where did it stall?&lt;\u002Fli&gt;&lt;li&gt;Roughly what are you investing in this area right now?&quot;&lt;\u002Fli&gt;&lt;\u002Fol&gt;\n&lt;p&gt;If they won&#x27;t answer #3, they&#x27;re likely not ready, and you just saved a call. If they do, you walk in knowing the budget and the pain.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;&lt;summary&gt;Scale it (when the pipeline is full)&lt;\u002Fsummary&gt;&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;ul style=&quot;padding-left:18px&quot;&gt;&lt;li&gt;Raise your prices once you are turning people away.&lt;\u002Fli&gt;&lt;li&gt;Build the automated engine (see the Build the engine tab) so leads come in without you searching.&lt;\u002Fli&gt;&lt;li&gt;Hand outreach to a VA using these exact templates and rules.&lt;\u002Fli&gt;&lt;li&gt;Turn your best-fit niche into a signature offer so every lead is pre-qualified.&lt;\u002Fli&gt;&lt;\u002Ful&gt;&lt;\u002Fdiv&gt;&lt;\u002Fdetails&gt;\n&lt;details&gt;\n&lt;summary&gt;Raise your rates (the script)&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You don&#x27;t need to apologize for this. You&#x27;ve gotten better, your time is worth more, and the client you&#x27;re afraid to tell this to already knows it. Give them notice, not a negotiation.&lt;\u002Fp&gt;\n&lt;pre&gt;Hi [Name], I wanted to give you a heads up before it shows up on an invoice.\n\nStarting [date, give at least 30 days notice], my rate for [service] is moving from [old rate] to [new rate]. This reflects [the added scope \u002F the results we&#x27;ve been getting \u002F simply that my rates are adjusting across the board, pick what&#x27;s true].\n\nNothing else about how we work together is changing, I just wanted you to hear it directly from me first instead of finding it on a new invoice. Happy to hop on a quick call if you want to talk through it.&lt;\u002Fpre&gt;\n&lt;p&gt;Send it as its own message, not buried in a status update. And don&#x27;t discount yourself in the same message you&#x27;re raising your rate, it undoes the whole point.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;details&gt;\n&lt;summary&gt;Ask for a testimonial (that you can actually use)&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Most testimonials are useless because the ask was too vague. &quot;Can you leave me a review?&quot; gets you &quot;great to work with!&quot; Ask for specifics instead.&lt;\u002Fp&gt;\n&lt;pre&gt;Hi [Name], I loved working on [specific project\u002Fresult] with you. Would you be open to sharing a quick testimonial? To make it easy, here are a few things that would help other founders picture what working together looks like:\n\n1. What was going on before we started working together?\n2. What specifically changed after (a number, a feeling, a habit that stopped)?\n3. Would you tell another founder to work with me, and why?\n\nEven a few sentences on those three helps a ton. No pressure on length, I just want it to sound like you, not like a generic review.&lt;\u002Fpre&gt;\n&lt;p&gt;Ask right after a win lands, not months later when the memory&#x27;s gone soft. And always ask if you can use their name and business, don&#x27;t assume.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;details&gt;\n&lt;summary&gt;Handle scope creep without being the bad guy&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Scope creep almost never feels like a big ask in the moment, it&#x27;s a &quot;quick favor&quot; here and a &quot;can you also just&quot; there. The fix isn&#x27;t saying no, it&#x27;s naming it kindly and putting it back on the agreement.&lt;\u002Fp&gt;\n&lt;pre&gt;Hey [Name], happy to help with that! Quick note, this falls outside what we scoped for [package name], so I want to flag it before I dive in rather than after.\n\nI can either:\n1. Add it as a one-off for [price], or\n2. We can build it into next month&#x27;s scope if this is something you&#x27;ll need regularly.\n\nEither works for me, just let me know which makes more sense and I&#x27;ll get started.&lt;\u002Fpre&gt;\n&lt;p&gt;You&#x27;re not punishing them for asking, you&#x27;re protecting the relationship from resentment down the line. Say yes to the work, not to doing it for free.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;details&gt;\n&lt;summary&gt;Spot a bad-fit client before you sign&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;The clients that burn you out the fastest are rarely the ones who seem difficult upfront, they&#x27;re the ones who seem fine until three weeks in. Watch for these before you sign anything.&lt;\u002Fp&gt;\n&lt;pre&gt;RED FLAGS:\n- They negotiate the price before they&#x27;ve even asked what&#x27;s included.\n- They mention a &quot;bad experience&quot; with every past provider, and it&#x27;s always the provider&#x27;s fault.\n- They want to start &quot;right away&quot; but can&#x27;t answer basic questions about their business or goals.\n- They ask you to work off-platform, off-contract, or &quot;just get started, we&#x27;ll figure out payment.&quot;\n- Every message has an urgency to it that has nothing to do with the actual work.&lt;\u002Fpre&gt;\n&lt;p&gt;&lt;b&gt;The graceful decline:&lt;\u002Fb&gt;&lt;\u002Fp&gt;\n&lt;pre&gt;Hi [Name], thank you for taking the time to talk through this with me. After thinking it over, I don&#x27;t think I&#x27;m the right fit for what you&#x27;re looking for right now, but I wish you the best finding someone who is. Feel free to reach back out if things change down the line.&lt;\u002Fpre&gt;\n&lt;p&gt;You don&#x27;t owe anyone a detailed reason. &quot;Not the right fit&quot; is a complete sentence.&lt;\u002Fp&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;details&gt;\n&lt;summary&gt;Your weekly numbers (health check)&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;You don&#x27;t need a dashboard full of metrics, you need to know if something&#x27;s off before it becomes a problem. Check these once a week, same day, same time.&lt;\u002Fp&gt;\n&lt;pre&gt;1. LEADS IN\nHow many real conversations started this week? If it&#x27;s dropped for two weeks straight, that&#x27;s your outreach or content telling you something, not a coincidence.\n\n2. RESPONSE RATE\nOf the people you reached out to, how many replied? A rate that&#x27;s quietly dropping usually means your opener needs a refresh, not that the whole strategy is broken.\n\n3. FOLLOW-UPS SENT\nLeads don&#x27;t go cold because people say no, they go cold because nobody follows up. If this number is at zero most weeks, that&#x27;s the leak.\n\n4. CLIENT CHECK-INS\nAny client gone quiet who&#x27;s usually chatty? That&#x27;s worth a message before it turns into a churn conversation.\n\nThese are directional, not guarantees, some weeks are just slow for reasons that have nothing to do with you. The point is noticing the pattern, not panicking over one bad week.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;details&gt;\n&lt;summary&gt;The first 5 clients mindset&lt;\u002Fsummary&gt;\n&lt;div style=&quot;font-size:13.5px&quot;&gt;&lt;p&gt;Your first five clients are not going to be your best-paying, most polished, easiest clients. They&#x27;re the ones who take a chance on you while you&#x27;re still figuring out your own process, and that&#x27;s exactly what makes them valuable.&lt;\u002Fp&gt;\n&lt;pre&gt;You are not behind because client #1 was messy. You&#x27;re not failing because you&#x27;re still writing your rules as you go. Every system in this blueprint, I built it after I needed it, not before.\n\nYour first five clients aren&#x27;t there to make you look good. They&#x27;re there to teach you what you actually don&#x27;t know yet: what questions you forgot to ask upfront, what boundary you needed and didn&#x27;t have, what part of your process was still in your head and not written down anywhere.\n\nTreat them well, learn everything you can from them, and don&#x27;t confuse a hard first client with a sign you picked the wrong path. You picked the path. You&#x27;re just early on it.&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;\n&lt;\u002Fdetails&gt;\n\n&lt;\u002Fsection&gt;\n\n&lt;section class=&quot;panel&quot; id=&quot;p-close&quot;&gt;\n &lt;h2 class=&quot;ph&quot;&gt;One last thing, from me to you&lt;\u002Fh2&gt;\n &lt;div class=&quot;sub&quot;&gt;You made it all the way to the end, and that already tells me something about you. You have the whole thing now: my prompts, my filters, my templates, this tool, the engine, the army. It&#x27;s all yours. So let&#x27;s make your very first move nice and small, okay?&lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;What you&#x27;re holding, in one breath&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;The exact system I use to find clients: a step-by-step build guide, engineered prompts that do the thinking, a filter that keeps only real buyers, an outreach bank in a human voice, a tool that tracks it all, and the blueprint for the AI team and automation behind it. Not theory. The real one.&lt;\u002Fp&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;Your first 48 hours (do exactly this)&lt;\u002Fh3&gt;\n  &lt;ol class=&quot;steps&quot;&gt;\n   &lt;li&gt;Fill in Setup once. Five minutes, that&#x27;s it.&lt;\u002Fli&gt;\n   &lt;li&gt;Run the Build Guide, Steps 1 and 2. Get your positioning sentence and your buyer phrases.&lt;\u002Fli&gt;\n   &lt;li&gt;Open Find, gather 10 posts. Score them with the Step 4 prompt. Keep the greens.&lt;\u002Fli&gt;\n   &lt;li&gt;Write 5 messages with the Step 5 prompt, in your voice. Send them.&lt;\u002Fli&gt;\n   &lt;li&gt;Log them in My Leads and set a reminder to follow up in 2 days.&lt;\u002Fli&gt;\n  &lt;\u002Fol&gt;\n  &lt;div class=&quot;note&quot;&gt;Five outreach messages sent in two days. Do that before you touch automation or the AI army. Prove it by hand first, then scale the fun stuff.&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;If it feels like a lot, come here for a second&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Breathe. You do not have to build the automated engine or the AI army to win, those are here for whenever you want them, no rush at all. The manual loop, find, filter, write, follow up, is the whole system, and it works beautifully on its own. Start there. I&#x27;ll be right here for the rest when you&#x27;re ready.&lt;\u002Fp&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;A last thing, from me&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;I built this because I got tired of watching people who are genuinely brilliant at what they do stay invisible, just because &quot;getting clients&quot; felt like some secret only other people had been let in on. It&#x27;s not a secret. It&#x27;s a system. And now it&#x27;s yours.&lt;\u002Fp&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;So run it. Mess it up gloriously. Adjust. Run it again. That is exactly how I got here, and it&#x27;s how you&#x27;ll get there too. I am so proud of you for betting on yourself, truly. You&#x27;ve got this, and I&#x27;m cheering you on the whole way. Now go find your people.&lt;\u002Fp&gt;\n  &lt;p style=&quot;text-align:right;color:var(--pink);font-weight:700;margin:8px 0 0&quot;&gt;Love, Gwen&lt;\u002Fp&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;h3 style=&quot;color:var(--pink);margin:0 0 8px;font-size:15px&quot;&gt;Tell me how it goes (I actually want to know)&lt;\u002Fh3&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;This is the part I love most. When something works for you, a first reply, a booked call, your first signed client, I genuinely want to hear about it. And if you have a minute, send me your thoughts and any feedback so I can keep making this better for you.&lt;\u002Fp&gt;\n  &lt;p style=&quot;font-size:13.5px&quot;&gt;Email me anytime at &lt;a href=&quot;mailto:info@ayalavirtualassistance.site&quot; style=&quot;color:var(--pink);font-weight:700&quot;&gt;info@ayalavirtualassistance.site&lt;\u002Fa&gt;.&lt;\u002Fp&gt;\n  &lt;div class=&quot;note&quot;&gt;And if this helped you land a client, I would be so grateful for a short testimonial I can share, just tell me what changed for you. Your win might be the exact thing that convinces the next person to finally bet on themselves too.&lt;\u002Fdiv&gt;\n &lt;\u002Fdiv&gt;\n\n &lt;div class=&quot;card&quot; style=&quot;text-align:center;border-color:color-mix(in srgb,var(--pink) 30%,transparent)&quot;&gt;&lt;b&gt;Want me in the room while you build it?&lt;\u002Fb&gt;&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;The 2-day workshop is where we set up your whole engine and your AI army together, live and tuned to your exact business. This tool is the map. The workshop is us walking it together.&lt;\u002Fspan&gt;&lt;\u002Fdiv&gt;\n &lt;div class=&quot;promo&quot;&gt;\n &lt;div class=&quot;k2&quot;&gt;&amp;#127903;&amp;#65039; Your buyer bonus&lt;\u002Fdiv&gt;\n &lt;h4&gt;50% OFF the 2-day live AI Workshop&lt;\u002Fh4&gt;\n &lt;p&gt;Because you got the Blueprint, you get half off my in-person workshop, where we build your full automated engine and your own AI employees together, live.&lt;\u002Fp&gt;\n &lt;div class=&quot;code&quot;&gt;&lt;b&gt;AIWORKSHOP50&lt;\u002Fb&gt;&lt;button onclick=&quot;if(navigator.clipboard){navigator.clipboard.writeText(&#x27;AIWORKSHOP50&#x27;)}this.textContent=&#x27;Copied \\u2713&#x27;;this.classList.add(&#x27;ok&#x27;)&quot;&gt;Copy code&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;\n &lt;p&gt;Use it when you grab your seat. Join the waitlist first to get the dates and founding price before anyone else.&lt;\u002Fp&gt;\n&lt;\u002Fdiv&gt;\n&lt;\u002Fsection&gt;\n&lt;\u002Fdiv&gt;\n&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;\u002Fdiv&gt;\n&lt;script&gt;\nvar LS=localStorage;\nfunction prof(){try{return JSON.parse(LS.getItem(&#x27;le:profile&#x27;)||&#x27;{}&#x27;)}catch(e){return {}}}\nfunction saveProf(p){LS.setItem(&#x27;le:profile&#x27;,JSON.stringify(p))}\nfunction leads(){try{return JSON.parse(LS.getItem(&#x27;le:leads&#x27;)||&#x27;[]&#x27;)}catch(e){return []}}\nfunction saveLeads(a){LS.setItem(&#x27;le:leads&#x27;,JSON.stringify(a))}\nfunction g(id){return document.getElementById(id)}\nfunction toast(m){var t=g(&#x27;toast&#x27;);t.textContent=m;t.classList.add(&#x27;show&#x27;);clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove(&#x27;show&#x27;)},1500)}\nfunction P(v,fb){return (v&amp;&amp;v.trim())?v.trim():fb}\n\u002F\u002F theme\n\n\u002F\u002F tabs\ndocument.querySelectorAll(&#x27;.tab&#x27;).forEach(function(t){t.onclick=function(){document.querySelectorAll(&#x27;.tab&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});t.classList.add(&#x27;on&#x27;);document.querySelectorAll(&#x27;.panel&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});g(&#x27;p-&#x27;+t.dataset.t).classList.add(&#x27;on&#x27;);if(t.dataset.t===&#x27;track&#x27;)renderLeads();window.scrollTo(0,0)}});\ng(&#x27;gostart&#x27;).onclick=function(){document.querySelector(&#x27;.tab[data-t=&quot;setup&quot;]&#x27;).click()};\ng(&#x27;exportleads&#x27;).onclick=function(){var a=leads();function q(v){v=(v==null?&#x27;&#x27;:String(v));return &#x27;&quot;&#x27;+v.replace(\u002F&quot;\u002Fg,&#x27;&quot;&quot;&#x27;)+&#x27;&quot;&#x27;;}var rows=[[&#x27;Name&#x27;,&#x27;Platform&#x27;,&#x27;Status&#x27;,&#x27;Their post&#x27;,&#x27;My message&#x27;,&#x27;Added&#x27;]].concat(a.map(function(l){var dt=&#x27;&#x27;;var t=parseInt(String(l.id).slice(0,13),10);if(t)dt=new Date(t).toLocaleDateString();return [l.name,l.platform,l.status,l.post,l.msg,dt];}));var csv=&#x27;\\uFEFF&#x27;+rows.map(function(r){return r.map(q).join(&#x27;,&#x27;)}).join(&#x27;\\r\\n&#x27;);var bl=new Blob([csv],{type:&#x27;text\u002Fcsv;charset=utf-8&#x27;});var u=URL.createObjectURL(bl);var a2=document.createElement(&#x27;a&#x27;);a2.href=u;a2.download=&#x27;my-leads.csv&#x27;;document.body.appendChild(a2);a2.click();setTimeout(function(){URL.revokeObjectURL(u);a2.remove()},1000);toast(&#x27;CSV downloaded \\u2713&#x27;)};\n\u002F\u002F load profile into form\n(function(){var p=prof();[&#x27;name&#x27;,&#x27;service&#x27;,&#x27;icp&#x27;,&#x27;voice&#x27;,&#x27;portfolio&#x27;,&#x27;website&#x27;,&#x27;book&#x27;].forEach(function(k){if(p[k])g(&#x27;f-&#x27;+k).value=p[k]})})();\ng(&#x27;save&#x27;).onclick=function(){var p={};[&#x27;name&#x27;,&#x27;service&#x27;,&#x27;icp&#x27;,&#x27;voice&#x27;,&#x27;portfolio&#x27;,&#x27;website&#x27;,&#x27;book&#x27;].forEach(function(k){p[k]=g(&#x27;f-&#x27;+k).value});saveProf(p);var m=g(&#x27;savedmsg&#x27;);m.style.display=&#x27;inline&#x27;;toast(&#x27;Profile saved \\u2713&#x27;);setTimeout(function(){m.style.display=&#x27;none&#x27;},1600)};\n\u002F\u002F copy blocks (delegated)\ndocument.addEventListener(&#x27;click&#x27;,function(e){if(e.target.classList.contains(&#x27;cp&#x27;)){var pre=e.target.closest(&#x27;.blk&#x27;).querySelector(&#x27;pre&#x27;);navigator.clipboard.writeText(pre.textContent);var o=e.target.textContent;e.target.textContent=&#x27;Copied&#x27;;e.target.classList.add(&#x27;ok&#x27;);setTimeout(function(){e.target.textContent=o;e.target.classList.remove(&#x27;ok&#x27;)},1200)}});\nfunction mkBlk(title,text){return &#x27;&lt;div class=&quot;blk&quot;&gt;&lt;div class=&quot;blkh&quot;&gt;&lt;span&gt;&#x27;+title+&#x27;&lt;\u002Fspan&gt;&lt;button class=&quot;cp&quot;&gt;Copy&lt;\u002Fbutton&gt;&lt;\u002Fdiv&gt;&lt;pre&gt;&#x27;+text.replace(\u002F&amp;\u002Fg,&#x27;&amp;amp;&#x27;).replace(\u002F&lt;\u002Fg,&#x27;&amp;lt;&#x27;).replace(\u002F&gt;\u002Fg,&#x27;&amp;gt;&#x27;)+&#x27;&lt;\u002Fpre&gt;&lt;\u002Fdiv&gt;&#x27;}\n\u002F\u002F FIND\ng(&#x27;genfind&#x27;).onclick=function(){var p=prof();var plat=g(&#x27;find-platform&#x27;).value;\n var t=&quot;You are my lead research assistant.\\nMy service: &quot;+P(p.service,&#x27;[YOUR SERVICE]&#x27;)+&quot;.\\nMy ideal client: &quot;+P(p.icp,&#x27;[YOUR IDEAL CLIENT]&#x27;)+&quot;.\\nPlatform I am searching: &quot;+plat+&quot;.\\n\\n1. Give me 25 exact phrases a person types or posts when they need my service but do not know me yet.\\n2. For each, show what a REAL buyer post looks like versus a time-waster.\\n3. List 10 hashtags or group types where these people gather on &quot;+plat+&quot;.\\nKeep it specific to my niche.&quot;;\n g(&#x27;find-out&#x27;).innerHTML=mkBlk(&#x27;Your search prompt (copy into your AI)&#x27;,t);};\n\u002F\u002F CONTENT\ng(&#x27;c-type&#x27;).onchange=function(){g(&#x27;c-topic-wrap&#x27;).style.display=(g(&#x27;c-type&#x27;).value===&#x27;caption&#x27;)?&#x27;block&#x27;:&#x27;none&#x27;};\ng(&#x27;gencontent&#x27;).onclick=function(){var p=prof();var ty=g(&#x27;c-type&#x27;).value;var t;\n var base=&quot;My service is &quot;+P(p.service,&#x27;[YOUR SERVICE]&#x27;)+&quot; and my ideal client is &quot;+P(p.icp,&#x27;[YOUR IDEAL CLIENT]&#x27;)+&quot;. Match my voice, here are my real sentences: &quot;+P(p.voice,&#x27;[PASTE 2 TO 3 OF YOUR SENTENCES]&#x27;)+&quot;.&quot;;\n if(ty===&#x27;ideas&#x27;) t=&quot;Act as my content strategist. &quot;+base+&quot;\\nGive me 10 short-form content ideas (a hook plus one line each) that would make my ideal client stop scrolling and DM me. Mix these angles: a pain they feel, a myth they believe, a quick win, a behind the scenes, and a bold opinion. Then write full captions for my 3 favorites.&quot;;\n else if(ty===&#x27;hooks&#x27;) t=&quot;Give me 20 scroll-stopping first lines (hooks) for short-form content. &quot;+base+&quot;\\nMake them specific, a little bold, and impossible to scroll past.&quot;;\n else t=&quot;Write a full, engaging social caption about \\&quot;&quot;+(g(&#x27;c-topic&#x27;).value||&#x27;[YOUR TOPIC]&#x27;)+&quot;\\&quot; for my ideal client. &quot;+base+&quot;\\nStart with a strong hook, keep it human, and end with a soft nudge to DM me or comment.&quot;;\n g(&#x27;content-out&#x27;).innerHTML=mkBlk(&#x27;Your content prompt (copy into your AI)&#x27;,t);};\n\u002F\u002F NEW LEAD\ng(&#x27;genlead&#x27;).onclick=function(){var p=prof();var post=g(&#x27;l-post&#x27;).value;if(!post.trim()){toast(&#x27;Paste their post first&#x27;);return}\n var ch=g(&#x27;l-channel&#x27;).value;\n var filter=&quot;Here is a post I found:\\n\\&qu
